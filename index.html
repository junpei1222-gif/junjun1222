<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>かんたん利益率計算</title><style>
:root{--ink:#17243d;--green:#1d9a79;--blue:#426b9c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#faf6ee,#eae7df);color:var(--ink);font-family:-apple-system,"Yu Gothic",sans-serif}.wrap{max-width:740px;margin:auto;padding:18px 12px}.top{display:flex;align-items:end;justify-content:space-between;margin:0 4px 10px}.tag{color:#47786a;font-size:9px;font-weight:800}h1{margin:0;font-size:27px}h1 b{color:var(--green)}.panel{padding:15px;border-radius:19px;background:#fffefa;box-shadow:0 18px 55px #2d2c2720}.section{display:flex;align-items:center;gap:8px;margin-bottom:9px}.num{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#eef5f2;color:#257e67;font-size:9px;font-weight:900}.section h2{margin:0;font-size:13px}.section small{color:#929087;font-size:8px}.clear{margin-left:auto;border:0;background:none;color:#8a665f;font-size:9px;font-weight:700}.group{display:flex;align-items:center;gap:6px;margin:8px 1px 5px;font-size:9px;font-weight:800}.group b{padding:3px 7px;border-radius:99px;background:var(--blue);color:#fff;font-size:8px}.group.client b{background:var(--green)}.group em{margin-left:auto;color:#6b756e;font-size:7px;font-style:normal}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.field>span{display:block;margin:0 1px 4px;font-size:9px;font-weight:800;white-space:nowrap}.field small{color:#888d92;font-size:7px}.money{display:flex;align-items:center;height:43px;padding:0 8px;border:1.5px solid #ddd8cf;border-radius:10px;background:#fff}.money:focus-within{border-color:var(--green)}.money input{width:100%;min-width:0;border:0;outline:0;text-align:right;background:transparent;color:var(--ink);font-size:17px;font-weight:800}.percent input{text-align:center}.money input::placeholder{color:#c8c3bb;font-size:9px}.arrow{text-align:center;height:12px;color:#aaa;font-size:10px}.results{padding-top:9px;margin-top:9px;border-top:1px dashed #d9d3ca}.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}.card{min-height:104px;overflow:hidden;border-radius:12px;background:linear-gradient(145deg,#294266,#385a88);color:#fff}.card.client{background:linear-gradient(145deg,#174c3e,#27775f)}.card.negative{background:linear-gradient(145deg,#713b37,#a14f47)}.card.waiting{background:linear-gradient(145deg,#777d87,#979ca4)}.head{display:flex;justify-content:space-between;padding:7px 9px;border-bottom:1px solid #ffffff25;font-size:9px}.head small{color:#ffffffb0;font-size:7px}.margin,.amount{padding:7px 9px}.margin{display:flex;align-items:end;justify-content:space-between}.margin small,.amount small{color:#ffffffbd;font-size:7px}.margin strong{font-size:22px}.margin em{font-size:10px;font-style:normal}.amount{padding-top:0}.amount strong{display:block;font-size:14px}.empty{height:73px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7px}.empty b{font-size:20px}.cost-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:8px 10px;border:1px solid #ded8ce;border-radius:10px;background:#f7f5f0;color:var(--ink)}.cost-toggle span{text-align:left}.cost-toggle b,.cost-toggle small{display:block}.cost-toggle b{font-size:9px}.cost-toggle small{color:#888278;font-size:7px}.cost-toggle i{font-size:16px;color:var(--green);font-style:normal}.cost{display:none;margin-top:6px;padding:9px;border-radius:11px;background:#f3f1eb}.modes{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px}.modes button{padding:7px;border:1px solid #d8d2ca;border-radius:8px;background:white;color:#72746f;font-size:8px;font-weight:800}.modes button.active{border-color:var(--green);background:#e9f5f1;color:#176f59}.cost .grid{grid-template-columns:1.4fr .6fr}.wash{display:flex;align-items:center;gap:7px;margin-top:7px;padding:7px;border-radius:8px;background:white;font-size:8px;font-weight:800}.wash input{width:17px;height:17px;accent-color:var(--green)}.wash b{margin-left:auto;color:var(--green)}.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:7px;color:#77756f;font-size:7px}.breakdown strong{grid-column:1/-1;padding-top:6px;border-top:1px dashed #d3cdc3;text-align:right;color:var(--ink);font-size:13px}.note{text-align:center;margin:7px 0 0;color:#85827b;font-size:7px}footer{text-align:center;margin-top:7px;color:#8e887f;font-size:8px}@media(max-width:600px){.wrap{padding:7px}.top{margin-bottom:6px}.tag{font-size:6px}h1{font-size:20px}.panel{padding:8px;border-radius:14px}.section{margin-bottom:6px}.num{width:22px;height:22px}.section h2{font-size:10px}.group{margin:5px 1px 3px;font-size:7px}.field>span{font-size:7px}.field small{font-size:5px}.money{height:35px;padding:0 6px}.money input{font-size:14px}.arrow{height:8px}.results{padding-top:6px;margin-top:6px}.card{min-height:86px}.head{padding:5px 7px;font-size:7px}.head small{font-size:5px}.margin,.amount{padding:5px 7px}.margin strong{font-size:18px}.amount{padding-top:0}.amount strong{font-size:11px}.empty{height:60px}.cost-toggle{margin-top:6px;padding:6px 8px}.note{font-size:5px}}
</style></head><body><main class="wrap"><header class="top"><div class="tag">％ 商談用 利益シミュレーター</div><h1>かんたん <b>利益率計算</b></h1></header><section class="panel"><div class="section"><span class="num">01</span><div><h2>価格を入力</h2><small>税率8％固定</small></div><button id="clear" class="clear">すべてクリア</button></div>
<div class="group"><b>自社</b>納品価格と控除</div><div class="grid"><label class="field"><span>納品価格 <small>税抜</small></span><div class="money">¥<input id="delivery" inputmode="numeric" placeholder="0"></div></label><label class="field"><span>センターフィー</span><div class="money percent"><input id="center" type="number" min="0" max="100" step=".01" placeholder="0">%</div></label><label class="field"><span>リベート</span><div class="money percent"><input id="rebate" type="number" min="0" max="100" step=".01" placeholder="0">%</div></label></div><div class="arrow">↓</div>
<div class="group client"><b>得意先</b>店頭での販売価格<em>税率8％</em></div><div class="grid"><label class="field"><span>販売価格 <small>税抜</small></span><div class="money">¥<input id="ex" inputmode="numeric" placeholder="0"></div></label><label class="field"><span>販売価格 <small>税込</small></span><div class="money">¥<input id="inc" inputmode="numeric" placeholder="0"></div></label><label class="field"><span>得意先利益率 <small>納品価格へ</small></span><div class="money percent"><input id="target" type="number" min="0" max="95" step=".1" placeholder="例20">%</div></label></div>
<div class="section results"><span class="num">02</span><div><h2>利益の結果</h2><small>フィー・リベート控除後</small></div></div><div class="cards"><article id="ownCard" class="card waiting"><div class="head"><b>自社</b><small>控除後の最終利益</small></div><div id="own" class="empty"><b>—</b><span>下の原価を入力</span></div></article><article id="clientCard" class="card client"><div class="head"><b>得意先</b><small>販売価格 − 納品価格</small></div><div class="margin"><small>利益率</small><strong id="cm">0.0<em>%</em></strong></div><div class="amount"><small>1袋あたり</small><strong id="cp">¥0</strong></div></article></div>
<button id="toggle" class="cost-toggle"><span><b>03　原価の設定</b><small id="costStatus">直接入力／玄米から算出</small></span><i id="toggleIcon">＋</i></button><section id="cost" class="cost"><div class="modes"><button id="directBtn" class="active">原価を直接入力</button><button id="riceBtn">玄米から算出</button></div><div id="directBox"><label class="field"><span>仕入原価 <small>税抜</small></span><div class="money">¥<input id="direct" inputmode="numeric" placeholder="0"></div></label></div><div id="riceBox" hidden><div class="grid"><label class="field"><span>玄米1俵（60kg）単価</span><div class="money">¥<input id="bale" inputmode="numeric" placeholder="25,000"></div></label><label class="field"><span>商品のキロ数</span><div class="money"><input id="weight" type="number" min="0" step=".1" placeholder="2">kg</div></label></div><label class="wash"><input id="washed" type="checkbox"><span>無洗米加工する</span><b>＋50円／袋</b></label><div class="breakdown"><span>歩留まり90％</span><span>袋代50円</span><span>固定経費9.21％</span><strong id="calculated">算出原価　—</strong></div></div></section><p class="note">自社利益 ＝ 納品価格 − 原価 − センターフィー − リベート</p></section><footer>営業先での価格提案や商談の確認に</footer></main>
<script>const $=x=>document.getElementById(x),nf=new Intl.NumberFormat('ja-JP'),yf=new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}),num=v=>Math.max(0,Number(String(v).replaceAll(',',''))||0),fmt=n=>n>0?Math.round(n).toLocaleString('ja-JP'):'';let mode='direct',open=false;function clean(v){let d=v.replace(/\D/g,'').slice(0,12);return d?nf.format(Number(d)):''}function reflect(){let e=num($('ex').value),m=$('target').value;if(e&&m!=='')$('delivery').value=fmt(Math.floor(e*(1-Number(m)/100)))}function render(){let d=num($('delivery').value),e=num($('ex').value),base=num($('bale').value)/54*(Number($('weight').value)||0)+50+($('washed').checked?50:0),rice=base/(1-.0921),p=mode==='rice'?rice:num($('direct').value),has=mode==='rice'?Boolean($('bale').value&&Number($('weight').value)>0):$('direct').value!=='',fees=d*(Number($('center').value)||0)/100+d*(Number($('rebate').value)||0)/100,op=d-p-fees,om=d?op/d*100:0,cp=e-d,cm=e?cp/e*100:0;$('ownCard').className='card '+(!has?'waiting':op<0?'negative':'');$('own').className=has?'':'empty';$('own').innerHTML=has?'<div class="margin"><small>利益率</small><strong>'+om.toFixed(1)+'<em>%</em></strong></div><div class="amount"><small>1袋あたり</small><strong>'+yf.format(op)+'</strong></div>':'<b>—</b><span>下の原価を入力</span>';$('clientCard').className='card client '+(cp<0?'negative':'');$('cm').innerHTML=cm.toFixed(1)+'<em>%</em>';$('cp').textContent=yf.format(cp);$('calculated').textContent='算出原価　'+(mode==='rice'&&has?yf.format(rice):'—');$('costStatus').textContent=has?'現在 '+yf.format(p):'直接入力／玄米から算出'}['delivery','direct','bale'].forEach(id=>$(id).oninput=e=>{e.target.value=clean(e.target.value);render()});['center','rebate','weight','washed'].forEach(id=>$(id).oninput=render);$('ex').oninput=e=>{e.target.value=clean(e.target.value);let n=num(e.target.value);$('inc').value=fmt(n+Math.floor(n*.08));reflect();render()};$('inc').oninput=e=>{e.target.value=clean(e.target.value);$('ex').value=fmt(Math.ceil(num(e.target.value)/1.08));reflect();render()};$('target').oninput=e=>{e.target.value=e.target.value===''?'':Math.min(95,Math.max(0,Number(e.target.value)));reflect();render()};$('toggle').onclick=()=>{open=!open;$('cost').style.display=open?'block':'none';$('toggleIcon').textContent=open?'−':'＋'};$('directBtn').onclick=()=>{mode='direct';$('directBtn').className='active';$('riceBtn').className='';$('directBox').hidden=false;$('riceBox').hidden=true;render()};$('riceBtn').onclick=()=>{mode='rice';$('riceBtn').className='active';$('directBtn').className='';$('riceBox').hidden=false;$('directBox').hidden=true;render()};$('clear').onclick=()=>{document.querySelectorAll('input').forEach(x=>{if(x.type==='checkbox')x.checked=false;else x.value=''});mode='direct';$('directBtn').click();render()};render();</script></body></html>
