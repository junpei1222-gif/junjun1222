  cv.height = Math.max(1, Math.round(ch * dpr));
  scaleX = cv.width / W;
  scaleY = cv.height / H;
  cssScale = cw / W;

function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function circRect(cx, cy, r, x, y, w, h) {
  const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy <= r * r;
}
function rectRect(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

function compact(a) { let j = 0; for (let i = 0; i < a.length; i++) { const o = a[i]; if (!o.dead) a[j++] = o; } a.length = j; }
function pad(n, len) { return String(Math.floor(n)).padStart(len, '0'); }
// 種から決まる乱数（ステージ配置を毎回同じにする）
function seeded(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ============================================================
//  入力（ゲームで使うキーはすべて preventDefault）
// ============================================================
const keys = {}, pressed = {};
const GAME_CODES = new Set([
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyZ', 'KeyX', 'KeyC', 'KeyP', 'KeyR', 'KeyM',
  'Space', 'Enter', 'NumpadEnter', 'Escape'
]);
window.addEventListener('keydown', e => {
  initAudio();                   // ゲームで使わないキーでも音声の解放を試みる（パッドだけの環境向け）
  if (!GAME_CODES.has(e.code)) return;
  e.preventDefault();
  touch.mode = false;            // キーボードを使い始めたらタッチ用ボタンは隠す（指で操作中は drawTouchUI 側で表示を保つ）
  // キーリピートは新規押下にしない（自動ポーズで keys を消した後の押しっぱなしで解除されないように）
  if (!keys[e.code] && !e.repeat) pressed[e.code] = true;
  keys[e.code] = true;
}, { passive: false });
window.addEventListener('keyup', e => {
  if (!GAME_CODES.has(e.code)) return;
  e.preventDefault();
  keys[e.code] = false;
}, { passive: false });
// クリック／タップでも AudioContext の再開を試みる
for (const ev of ['pointerdown', 'mousedown', 'click']) window.addEventListener(ev, () => initAudio());
// ポーズを切り替える入力（全入力元）。自動ポーズの瞬間に届いていたものはここで捨てる
const PAUSE_TOGGLES = ['KeyP', 'Escape', 'GpStart', 'GpSelect', 'TouchPause'];
function discardTouchMove() { touch.accX = touch.accY = touch.adjY = 0; }
// 自動ポーズ（フォーカス喪失・パッド切断）の共通処理
// away：フォーカスを失っている／裏に回っている間 true。クリア画面の自動遷移タイマーを止めるのに使う
let away = false;
function autoPause() {
  for (const k of PAUSE_TOGGLES) delete pressed[k];
  discardTouchMove();
  if (state === 'play') paused = true;
}
function releaseAll() {
  for (const k in keys) keys[k] = false;
  for (const k in pressed) delete pressed[k];   // 押下履歴も消す
  touchReset();
  gpRebase = true;
  autoPause();
}
window.addEventListener('blur', () => { away = true; releaseAll(); });
// フォーカス復帰後の最初のサンプルをゲームパッドの基準にする（押しっぱなしのSTARTを新規押下と見なさない）
window.addEventListener('focus', () => { away = false; gpRebase = true; });
// 操作があればその画面を見ているとみなす（focus イベントが来ない環境で away が残り続けないように）
for (const ev of ['keydown', 'pointerdown', 'touchstart']) window.addEventListener(ev, () => { away = false; }, { passive: true });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    away = true;
    releaseAll();
    // 裏に回ったら音も止める（BGMのスケジューラが間引かれて崩れないように）
    if (AC && AC.state === 'running') { const r = AC.suspend(); if (r && r.catch) r.catch(() => {}); }
  } else {
    gpRebase = true;
    away = typeof document.hasFocus === 'function' ? !document.hasFocus() : false;
    if (AC && AC.state !== 'running' && AC.state !== 'closed') { const r = AC.resume(); if (r && r.catch) r.catch(() => {}); }
  }
});

// ============================================================
//  タッチ操作（スマートフォン）
//  ・ボタン以外をドラッグ → 自機が指の移動量だけ相対移動。タッチ中は自動連射
//  ・指が自機に重なる位置で触れたら、自機を指の少し上へ寄せて隠れないようにする
//  ・右下：パワーアップ発動（その左にボム）、右上：ポーズ（プレイ中、タッチ操作時のみ表示）
//  レターボックスの黒帯も含め画面全体で受け付け、スクロール／ズームは止める。
// ============================================================
const isTouchDev = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const TOUCH_SENS = 1.0;            // 指の移動量 → 自機の移動量の倍率
const TOUCH_MAX_STEP = 32;         // 1更新あたりの最大移動量（残りは次の更新へ繰り越し）
const TOUCH_LIFT_CSS = 50;         // 自機を指より上へずらす量（画面上のCSSピクセル）
const touch = { mode: false, dragId: null, lx: 0, ly: 0, accX: 0, accY: 0, adjY: 0 };
function touchReset() { touch.dragId = null; touch.accX = touch.accY = touch.adjY = 0; }
// タッチ用ボタンを出すか（キー／パッドに触れても、追跡中の指がある間は出し続ける）
function touchUIOn() { return touch.mode || touch.dragId !== null; }
function toGame(t) {
  const r = cv.getBoundingClientRect();
  return { x: (t.clientX - r.left) * W / (r.width || 1), y: (t.clientY - r.top) * H / (r.height || 1) };
}
// ボタン配置（ゲーム座標）。画面が小さいほどゲーム座標上は大きくして、指で押せる大きさを保つ
function tbtnLayout() {
  const k = 1 / (cssScale || 1);
  const r = clamp(34 * k, 40, 84), s = clamp(44 * k, 44, 90);
  // ボムボタン：発動ボタンの左。両者の判定余白（各12）が重ならないよう縁どうしを28空ける
  const br = Math.round(r * 0.72), px = W - r - 16, py = H - r - 44;
  return { pwr: { x: px, y: py, r }, bomb: { x: px - r - 28 - br, y: py + r - br, r: br }, pause: { x: W - s - 10, y: 8, s } };
}
function hitPause(p, L) { const b = L.pause, m = 12; return p.x >= b.x - m && p.x <= b.x + b.s + m && p.y >= b.y - m && p.y <= b.y + b.s + m; }
function hitPower(p, L) { const b = L.pwr; return Math.hypot(p.x - b.x, p.y - b.y) <= b.r + 12; }
function hitBomb(p, L) { const b = L.bomb; return Math.hypot(p.x - b.x, p.y - b.y) <= b.r + 12; }
function onTouchStart(e) {
  e.preventDefault();
  initAudio();
  touch.mode = true;
  // 取りこぼした touchend 対策：追跡中の指がもう画面に無ければ解放
  if (touch.dragId !== null && !Array.prototype.some.call(e.touches, t => t.identifier === touch.dragId)) touch.dragId = null;
  for (const t of e.changedTouches) {
    const p = toGame(t);
    if (state === 'play') {
      const L = tbtnLayout();
      if (hitPause(p, L)) { pressed.TouchPause = true; continue; }
      if (!paused && hitPower(p, L)) { pressed.TouchPower = true; continue; }
      if (!paused && hitBomb(p, L)) { pressed.TouchBomb = true; continue; }
    } else {
      pressed.TouchTap = true;     // タイトルでスタート／ゲームオーバー・クリア後に進む

function band(x, a, b, f) { if (x <= a || x >= b) return 0; return Math.min(1, (x - a) / f, (b - x) / f); }

  const flat  = band(wx, 3450, 5450, 220) * 70;

//  ステージ構成（スクロール位置で出現）
// ============================================================
// ステージの敵配置を、ステージの編成の重み（mix）から種つき乱数で組み立てる（毎回同じ配置になる）。
// 区間構成は全ステージ共通：開けた宙域 → 丘陵 → 要塞（中ボス）→ 洞窟 → ボス
function buildStage(st) {
  const S = STAGES[st - 1], R = seeded(st * 7919 + 101), mix = S.mix, gap = D().gap;
  const ev = [];
  const A = (at, type, o) => ev.push(Object.assign({ at: Math.round(at), type }, o || {}));
  const pick = allowTurret => {
    let sum = 0;
    for (const k in mix) if (allowTurret || k !== 'turret') sum += mix[k];
    let r = R() * sum;

        break;

        }

  // 区間B：起伏のある丘陵
  const tShare = mix.turret / (mix.wave + mix.straight + mix.aimer + mix.turret);
  let i = 0;
  for (let at = 1300; at <= 2900; at += 200 * gap, i++) {
    const t = pick(true);
    if (t === 'turret') {
      A(at, 'turret', { side: S.ter.ceil > 0.5 && R() < 0.3 ? 'ceil' : 'floor' });
      if (R() < tShare) A(at + 70, 'turret', { side: 'floor' });
      air(at + 50, pick(false), false, 100, 330);
    } else {
      air(at, t, false, 100, 330);
      if (R() < tShare + 0.15) A(at + 70, 'turret', { side: 'floor' });
    }
    if (i % 4 === 1) air(at + 110, 'straight', false, 110, 300, true);

  air(3150, pick(false), false);
  air(3250, pick(false), false);
  // 中盤：地上要塞（中ボス）
  A(FORT_WX - W - 20, 'fortress');
  A(3420, 'wave', { y: 140, amp: 40 });
  // 区間D：洞窟（天井・地面の砲台）
  i = 0;
  for (let at = 4250; at <= 7700; at += 180 * gap, i++) {
    const t = pick(true);

      A(at, 'turret', { side: R() < 0.5 ? 'floor' : 'ceil' });
      if (R() < 0.6) A(at + 20, 'turret', { side: R() < 0.5 ? 'floor' : 'ceil' });
    } else {
      air(at, t, true);
      if (R() < tShare) A(at + 90, 'turret', { side: R() < 0.5 ? 'floor' : 'ceil' });
    }
    if (i % 5 === 3) A(at + 40, 'straight', { ys: ['mid'], red: 1 });

  air(8100, pick(false), false, 150, 380);
  A(8300, 'straight', { ys: [150, 270, 390], red: 1 });
  // 最後：ステージボス
  A(BOSS_AT, 'boss');
  ev.sort((a, b) => a.at - b.at);
  return ev;
}

      }
      if (b.y < ceilY(b.x)) { b.dead = true; continue; }
    } else if (b.kind === 'umis') {
      // 上方向ミサイル：前下方ミサイルの上下反転。天井に着いたら天井に沿って右へ這い、天井が途切れたら真上へ飛び直す
      if (!b.crawl) {
        b.x += b.vx; b.y += b.vy;
        const cy = ceilY(b.x);
        if (cy > 1 && b.y <= cy + 3) {
          if (cy > b.y + 12) { b.dead = true; spark(b.x, b.y, '#ffb040'); continue; }
          b.crawl = true; b.y = cy + 3;
        }
      } else {
        const nx = b.x + 3.6, cy = ceilY(nx);
        if (cy <= 1) { b.crawl = false; b.vx = 0; b.vy = -Math.hypot(2.2, 3.6); b.x = nx; }
        else if (cy > b.y + 10) { b.dead = true; spark(b.x + 4, b.y, '#ffb040'); continue; }   // 壁に衝突
        else { b.x = nx; b.y = cy + 3; }
      }
      if (b.y > groundY(b.x)) { b.dead = true; continue; }
    } else if (b.kind === 'laser') {
      if (!b.wait) b.x += b.vx;   // 部位のクールダウン明けを待っている区間は、部位の表面で止まったまま
    } else {
      b.x += b.vx; b.y += b.vy;
    }
    // 画面外で消える。前下方ミサイルは下端 +20px、上方向ミサイルは上端 -20px まで残る（上下対称）
    if (b.x > W + (b.len || 0) + 10 || b.x < -20 || b.y < -20 || b.y > H + 20) { b.dead = true; continue; }
    if (b.kind !== 'missile' && b.kind !== 'umis' && (b.y > groundY(b.x) || b.y < ceilY(b.x))) { b.dead = true; spark(b.x, b.y); continue; }
    if (b.kind === 'laser') { laserStep(b); continue; }
    hitEnemies(b);
    if (b.dead) continue;
    if (fort && fort.state === 'alive' && hitStruct(fort, b)) { b.dead = true; continue; }
    if (boss && bossHittable() && hitStruct(boss, b)) { b.dead = true; continue; }
  }

}
function bossHittable() { return (boss.state === 'fight' || boss.state === 'enter') && boss.x < W + 120; }
// lim：レーザー区間の先端をこのXで打ち切る（その先にあるボス・中ボスの部位より奥へは届かない）
function hitEnemies(b, lim = Infinity) {
  const isL = b.kind === 'laser', br = (b.kind === 'missile' || b.kind === 'umis') ? 6 : 5;
  const lx0 = isL ? laserBackX(b) : 0, lw = isL ? Math.min(b.x, lim) - lx0 : 0;
  if (isL && lw <= 0) return;
  for (const e of enemies) {
    if (e.dead) continue;
    if (isL) {
      // 貫通ビーム：通常敵では止まらず、この区間（長さ b.len × 太さ LASER_H）に重なる敵すべてに当たる。
      // 同じ敵へは発射元ごとに b.iv フレーム（レベル別、LASER_LV）に1回だけダメージ。
      // 要塞の搭載砲台は中ボスの部位なので、ここでは扱わない（laserStep で最も手前の部位として当たり、区間はそこで止まる）
      if (e.mount) continue;
      if (circRect(e.cx, e.cy, e.r, lx0, b.y - LASER_H / 2, lw, LASER_H) && laserReady(b, e)) damageEnemy(e, b.dmg);
    } else {
      const dx = e.cx - b.x, dy = e.cy - b.y, rr = e.r + br;
      if (dx * dx + dy * dy < rr * rr) { damageEnemy(e, b.dmg); b.dead = true; return; }
    }
  }
}
function damageEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = 3;
  if (e.hp <= 0) killEnemy(e); else sfx('hit');
}
// noRevenge=true：ボス撃破の道連れなど、撃ち返し弾を出さない撃破
function killEnemy(e, noRevenge) {
  e.dead = true;
  // 封印型要塞の砲台：撃破数で封印解除を判定する（画面外へ出た砲台は数えない）
  if (e.mount && fort && e.mount.obj === fort && fort.state === 'alive') fortTurretDown(fort);
  addScore(e.score);
  explode(e.cx, e.cy, e.type === 'aimer' ? 2 : 1);
  if (e.capsule) dropCap(e.cx, e.cy);
  if (e.group) {
    const g = groups[e.group];
    if (g && ++g.killed === g.n) { dropCap(e.cx, e.cy); addText(e.cx, e.cy - 18, '編隊全滅', '#ffcf6a'); }
  }
  // 2周目以降は撃ち返し弾
  const d = D();
  if (!noRevenge && d.revenge > 0 && P.alive && Math.random() < d.revenge && Math.hypot(P.x - e.cx, P.y - e.cy) > 110) aimShot(e.cx, e.cy, 3);
}

// ============================================================
//  敵
// ============================================================
function updateEnemies() {
  const d = D(), sp = G.scrollSpeed;
  for (const e of enemies) {
    if (e.dead) continue;
    e.t++;
    if (e.flash > 0) e.flash--;
    switch (e.type) {
      case 'wave':
        e.x += e.vx;
        e.y = (e.follow ? gapMid(e.x) : e.baseY) + e.amp * Math.sin(e.x * 0.012);
        e.cx = e.x; e.cy = e.y;
        break;
      case 'straight':
        e.x += e.vx;
        if (e.follow) e.y += (gapMid(e.x) - e.y) * 0.1;
        e.cx = e.x; e.cy = e.y;
        break;
      case 'aimer':
        if (e.phase === 'in') {
          e.x += (e.targetX - e.x) * 0.045 - 0.4;
          if (e.x <= e.targetX + 2) { e.phase = 'hold'; e.t = 0; }
        } else if (e.phase === 'hold') {
          if (P.alive) e.y += clamp(P.y - e.y, -1.1, 1.1);
          if (--e.fireT <= 0) { e.fireT = Math.round(rand(70, 100) / d.fr); if (P.alive) { aimShot(e.x - 14, e.y, 3.2); sfx('eshot'); } }
          if (e.t > 320) e.phase = 'out';
        } else {
          e.x += 3.2;
          if (e.x > W + 60) e.dead = true;
        }
        e.y = clamp(e.y, ceilY(e.x) + 28, groundY(e.x) - 28);
        e.cx = e.x; e.cy = e.y;
        break;
      case 'turret': {
        if (e.mount) { e.x = e.mount.obj.x + e.mount.dx; e.y = e.mount.obj.gy + e.mount.dy; }
        else { e.x -= sp; e.y = e.side === 'floor' ? groundY(e.x) : ceilY(e.x); }
        const s = e.side === 'floor' ? -1 : 1;
        e.cx = e.x; e.cy = e.y + s * 8;
        const bx = e.cx, by = e.cy;
        const inSight = e.side === 'floor' ? P.y < by - 4 : P.y > by + 4;
        if (P.alive) {
          let a = Math.atan2(P.y - by, P.x - bx);
          if (e.side === 'floor') { if (a > 0) a = a < Math.PI / 2 ? -0.05 : -Math.PI + 0.05; }
          else { if (a < 0) a = a > -Math.PI / 2 ? 0.05 : Math.PI - 0.05; }
          e.ang += angDiff(a, e.ang) * 0.12;
        }
        if (--e.fireT <= 0) {
          e.fireT = Math.round(rand(100, 160) / d.fr);
          if (P.alive && inSight && e.x > 30 && e.x < W - 20 && Math.hypot(P.x - bx, P.y - by) > 90) {
            eShot(bx + Math.cos(e.ang) * 14, by + Math.sin(e.ang) * 14, e.ang, 3 * d.bs);
            sfx('eshot');
          }
        }
        break;
      }
    }
    if (e.x < -60) e.dead = true;
    // 体当たり
    if (!e.dead && P.alive && P.inv <= 0) {
      const dx = e.cx - P.x, dy = e.cy - P.y, rr = e.r + 6;
      if (dx * dx + dy * dy < rr * rr) { killPlayer(); damageEnemy(e, 3); }
    }
  }
  compact(enemies);
}

// ============================================================
//  構造物（要塞・ボス）共通
//   body    : 船体の矩形 [dx,dy,w,h]。弾を弾く（hullDmg があればコアへ減衰ダメージを通す）
//   plates  : 壊せる装甲板 {dx,dy,w,h,hp,max,flash}。弾を遮る
//   cores   : 弱点 {dx,dy,r,hp,max,flash,guard,gk,hidden,shutter,open,rage}
//             guard=true の間はダメージ無効。gk は理由（'lock' 封印 / 'shut' 閉鎖 / 'barrier' バリア / 'move' 移動中）
//             hidden=true は本体に隠れていて当たらない（ダメージ無効。レーザーは縁がはみ出していればそこで吸収される）。shutter=true は開閉扉つき（open: 0 閉〜1 開）
//   devices : バリア発生装置などの小さな壊せる部位 {dx,dy,r,hp,max,flash,dead,prog}
//   判定順：通常弾・ミサイルは 装置 → 装甲板 → コア → 船体。レーザーは区間に重なる部位のうち最も手前の1つ（laserFront）
//   s.core は常に cores[0]（互換用）。全コアの hp が 0 になったら s.onDestroy()
// ============================================================
function mkCore(dx, dy, r, hp, o) {
  const h = Math.max(1, Math.round(hp));
  return Object.assign({ dx, dy, r, hp: h, max: h, flash: 0, deny: 0, guard: false, gk: '', hidden: false,
                         shutter: false, open: 1, rage: false, label: '' }, o || {});
}
function liveCores(s) { let n = 0; for (const c of s.cores) if (c.hp > 0) n++; return n; }
function livePlates(s) { let n = 0; for (const p of s.plates) if (p.hp > 0) n++; return n; }
function liveDevices(s) { let n = 0; for (const v of s.devices) if (!v.dead) n++; return n; }
function coreHitR(c) { return c.r + (c.guard && c.gk === 'barrier' ? 16 : 0); }
// 開閉サイクル：閉 closed → 開く tr → 開 open → 閉じる tr。0（閉）〜1（開）を返す
function shutterOpen(t, closed, open, tr) {
  const p = t % (closed + open + tr * 2);
  if (p < closed) return 0;
  if (p < closed + tr) return (p - closed) / tr;
  if (p < closed + tr + open) return 1;
  return 1 - (p - closed - tr - open) / tr;
}
function damageCore(s, c, dmg, quiet) {
  if (c.hp <= 0) return;
  c.hp -= dmg;
  if (!quiet) c.flash = 3;
  if (c.hp <= 0) {
    c.hp = 0; s.lastCore = c;
    if (liveCores(s) === 0) { s.onDestroy(); return; }
    if (s.onCoreDown) s.onCoreDown(c);
  } else if (!quiet) sfx('hit');
  if (s.onHit) s.onHit(c);
}
// 部位へのダメージ（通常弾・ミサイル用の hitStruct と、レーザー用の laserHitPart で共通）
function hitDevice(s, v, dmg) {
  v.hp -= dmg; v.flash = 3;
  if (v.hp <= 0) {
    v.hp = 0; v.dead = true; v.respT = 0;
    // 加点は装置ごとに初回の破壊だけ（復活した装置の再破壊は0点。撃破演出とバリア解除は毎回）
    explode(s.x + v.dx, s.oy + v.dy, 2);
    if (!v.scored) { v.scored = true; addScore(500); }
    if (s.onDeviceDown) s.onDeviceDown(v);
    if (s.syncGuard) s.syncGuard();   // 全装置破壊ならバリアをその場で解除（同じ更新の後続弾から通る）
  } else sfx('hit');
}
function hitPlate(s, p, dmg) {
  p.hp -= dmg; p.flash = 3;
  if (p.hp <= 0) {
    explode(s.x + p.dx + p.w / 2, s.oy + p.dy + p.h / 2, 1); addScore(s.plateScore || 200);
    if (s.onPlateDown) s.onPlateDown(p);
    if (s.syncGuard) s.syncGuard();   // 全装甲破壊なら封印をその場で解除（同じ更新の後続弾から通る）
  } else sfx('tink');
}
// 通常弾・ダブル・ミサイル用（レーザーは laserStep）。判定順：装置 → 装甲 → コア → 船体
function hitStruct(s, b) {
  const x0 = b.x - 5, y0 = b.y - 4, w = 10, h = 8;
  const ox = s.x, oy = s.oy;
  // ボス登場中（'enter'）は全部位（装置・装甲・コア・船体）が無敵。弾は当たって弾かれるだけ。
  // 弱点の仕掛け（開閉・移動・公転など）は 'fight' に入ってから動くので、その前に削ってギミックを飛ばせないようにする
  const inert = s.state === 'enter';
  const deflect = col => { spark(b.x, b.y, col || '#c8cce0'); sfx('tink'); return true; };
  for (const v of s.devices) {
    if (v.dead || !circRect(ox + v.dx, oy + v.dy, v.r, x0, y0, w, h)) continue;
    if (inert) return deflect('#9ff6ff');
    hitDevice(s, v, b.dmg);
    return true;
  }
  for (const p of s.plates) {
    if (p.hp <= 0 || !rectRect(x0, y0, w, h, ox + p.dx, oy + p.dy, p.w, p.h)) continue;
    if (inert) return deflect();
    hitPlate(s, p, b.dmg);
    return true;
  }
  for (const c of s.cores) {
    if (c.hp <= 0 || c.hidden || !circRect(ox + c.dx, oy + c.dy, coreHitR(c), x0, y0, w, h)) continue;
    if (inert) { c.deny = 6; return deflect(c.gk === 'barrier' ? '#9ff6ff' : '#c8cce0'); }
    // 閉じている／装甲・バリアで守られている間は無効
    if (c.guard) { spark(b.x, b.y, c.gk === 'barrier' ? '#9ff6ff' : '#c8cce0'); sfx('tink'); c.deny = 6; }
    else damageCore(s, c, b.dmg);
    return true;
  }
  for (const r of s.body) {
    if (!rectRect(x0, y0, w, h, ox + r[0], oy + r[1], r[2], r[3])) continue;
    if (inert) return deflect();
    if (s.hullDmg) {
      // 本体（甲殻）への攻撃：コアへ大幅減衰したダメージだけ通す（全武器共通のボス側ギミック）
      const c = s.cores.find(k => k.hp > 0 && !k.guard);
      s.hullFlash = 3; spark(b.x, b.y, '#ffcf9a'); sfx('tink');
      if (c) damageCore(s, c, b.dmg * s.hullDmg, true);
    } else { spark(b.x, b.y); sfx('tink'); }
    return true;
  }
  return false;
}

// ---- レーザーとボス・中ボスの部位 ----
// ビームは部位を貫通しない。区間（長さ b.len × 太さ LASER_H）に重なる部位のうち、空間的に最も手前（プレイヤー側＝帯の中で
// 左端が最も左）の1つにだけ当たり、その奥の部位・通常敵には届かない。要塞の搭載砲台もここで部位として扱う。
// 円の部位について、帯 [y0, y1] の中で最も左の点のX
function circEntryX(cx, cy, r, y0, y1) {
  const dy = cy < y0 ? y0 - cy : cy > y1 ? cy - y1 : 0;
  return cx - Math.sqrt(Math.max(0, r * r - dy * dy));
}
// 発射元 src（0=自機、1〜=オプション）の砲口のX（fireWeapons の発射位置と同じ）。もうない発射元なら null
function laserMuzzleX(src) {
  if (src === 0) return P.x + 18;
  if (src - 1 >= P.options) return null;
  const o = optPos(src - 1);
  return o ? o.x + 8 : null;
}
// 区間 b の当たり判定の後端X。撃ち続けている間の最新の区間（発射から LASER_CD 未満＝次の区間がまだ出ていない）は、
// 砲口から区間の後端までの隙間も含める（ビームは砲口からつながっている）。区間は発射フレームに LASER_V 進んでから判定されるため、
// これがないと砲口直前の部位を飛び越したり、砲口直近の通常敵に毎フレーム重ならず再ヒット間隔が伸びたりする。
// 砲口より後ろには伸ばさない
function laserBackX(b) {
  const bx = b.x - b.len;
  if (P.alive && P.lzFireT === G.t && b.born >= P.lzHold0 && G.t - b.born < LASER_CD) {
    const mx = laserMuzzleX(b.src);
    if (mx !== null && mx < bx) return mx;
  }
  return bx;
}
// 区間 b に重なる最も手前の部位 { s: 構造物, k: 種類, o: 部位, x: 手前側の端のX } を返す（なければ null）
function laserFront(b) {
  const x0 = laserBackX(b), y0 = b.y - LASER_H / 2, w = b.x - x0, h = LASER_H, y1 = y0 + h;
  let best = null;
  const take = (s, k, o, x) => { if (!best || x < best.x) best = { s, k, o, x }; };
  const scan = s => {
    const ox = s.x, oy = s.oy;
    // 同じX（同着）のときは従来の優先順（装置 → 装甲 → コア → 船体 → 搭載砲台）
    for (const v of s.devices) if (!v.dead && circRect(ox + v.dx, oy + v.dy, v.r, x0, y0, w, h)) take(s, 'dev', v, circEntryX(ox + v.dx, oy + v.dy, v.r, y0, y1));
    for (const p of s.plates) if (p.hp > 0 && rectRect(x0, y0, w, h, ox + p.dx, oy + p.dy, p.w, p.h)) take(s, 'plate', p, ox + p.dx);
    // 隠れたコア（hidden）も対象（ダメージは入らないが、本体から縁がはみ出していればビームはそこで吸収される。laserHitPart）
    for (const c of s.cores) if (c.hp > 0 && circRect(ox + c.dx, oy + c.dy, coreHitR(c), x0, y0, w, h)) take(s, 'core', c, circEntryX(ox + c.dx, oy + c.dy, coreHitR(c), y0, y1));
    for (const r of s.body) if (rectRect(x0, y0, w, h, ox + r[0], oy + r[1], r[2], r[3])) take(s, 'body', r, ox + r[0]);
    for (const e of enemies) if (!e.dead && e.mount && e.mount.obj === s && circRect(e.cx, e.cy, e.r, x0, y0, w, h)) take(s, 'turret', e, circEntryX(e.cx, e.cy, e.r, y0, y1));
  };
  if (fort && fort.state === 'alive') scan(fort);
  if (boss && bossHittable()) scan(boss);
  return best;
}
// クールダウン中の対象 t の前で区間 b を待機させる（2=待機）。同じ発射元・同じ対象で待機できるのは1区間だけで、
// 後から来た区間は従来どおり吸収される（1=消える）。待機中の区間は毎フレーム再判定され、クールダウン明けのフレームで当たる
function laserWait(b, t) {
  const q = t.lzW || (t.lzW = []), w = q[b.src];

  q[b.src] = b; b.wait = t;
  return 2;
}
// 選ばれた部位 hp に区間 b を当てる。0=当たらない（使わない）／1=当たって消える／2=クールダウン明けまで部位の表面で待機
// ダメージは部位ごと・発射元ごとに b.iv フレームに1回、1ヒット=b.dmg（どちらもレベル別、LASER_LV）
function laserHitPart(hp, b) {
  const s = hp.s, o = hp.o;
  if (s.state === 'enter') {   // ボス登場中は全部位が無敵（弾かれて消える）
    if (hp.k === 'core') o.deny = 6;
    spark(b.x, b.y, hp.k === 'dev' || (hp.k === 'core' && o.gk === 'barrier') ? '#9ff6ff' : '#c8cce0'); sfx('tink');
    return 1;
  }
  switch (hp.k) {
    case 'turret':
      if (!laserReady(b, o)) return laserWait(b, o);
      damageEnemy(o, b.dmg); return 1;
    case 'dev':
      if (!laserReady(b, o)) return laserWait(b, o);
      hitDevice(s, o, b.dmg); return 1;
    case 'plate':
      if (!laserReady(b, o)) return laserWait(b, o);
      hitPlate(s, o, b.dmg); return 1;
    case 'core':
      // 本体の奥に隠れたコア：ダメージは入らないが、ビームはここで吸収される（奥の部位・通常敵には届かない）
      if (o.hidden) { spark(b.x, b.y, '#c8cce0'); sfx('tink'); return 1; }
      // 閉じている／装甲・バリアで守られている間は無効。ビームはこのコアに吸収され、奥には届かない
      if (o.guard) { spark(b.x, b.y, o.gk === 'barrier' ? '#9ff6ff' : '#c8cce0'); sfx('tink'); o.deny = 6; return 1; }
      if (!laserReady(b, o)) return laserWait(b, o);
      damageCore(s, o, b.dmg); return 1;
    case 'body': {
      if (!s.hullDmg) { spark(b.x, b.y); sfx('tink'); return 1; }
      // 甲殻（S3）：コアへ大幅減衰したダメージだけ通す。再ヒット間隔はコアに掛かる
      const c = s.cores.find(k => k.hp > 0 && !k.guard);
      if (c && !laserReady(b, c)) return laserWait(b, c);
      s.hullFlash = 3; spark(b.x, b.y, '#ffcf9a'); sfx('tink');

// レーザー区間1つ分の当たり判定（移動・画面外・地形の処理は updatePBullets 側）
function laserStep(b) {
  const hp = laserFront(b);

  const r = hp ? laserHitPart(hp, b) : 0;

}
function structHitsPlayer(s, x = P.x, y = P.y) {

  for (const r of s.body) if (rectRect(px, py, pw, ph, s.x + r[0], s.oy + r[1], r[2], r[3])) return true;
  for (const p of s.plates) if (p.hp > 0 && rectRect(px, py, pw, ph, s.x + p.dx, s.oy + p.dy, p.w, p.h)) return true;
  for (const v of s.devices) if (!v.dead && circRect(s.x + v.dx, s.oy + v.dy, v.r, px, py, pw, ph)) return true;
  for (const c of s.cores) if (c.hp > 0 && !c.hidden && circRect(s.x + c.dx, s.oy + c.dy, c.r, px, py, pw, ph)) return true;

function tickStructFlash(s) {
  for (const c of s.cores) { if (c.flash > 0) c.flash--; if (c.deny > 0) c.deny--; }
  for (const p of s.plates) if (p.flash > 0) p.flash--;

// 弾幕の部品
function fan(x, y, n, spread, ang, spd, noBlock) { for (let k = 0; k < n; k++) eShot(x, y, ang + (k - (n - 1) / 2) * spread, spd * D().bs, noBlock); }

function ring(x, y, n, spd, off) { const o = off === undefined ? Math.random() * TAU : off; for (let k = 0; k < n; k++) eShot(x, y, o + k * TAU / n, spd * D().bs, true); }

// 攻撃タイマー：period（発射頻度で短縮）ごとに true。first は最初の待ち
function every(o, key, period, first) {
  if (o.T[key] === undefined) o.T[key] = first !== undefined ? first : period;
  if (--o.T[key] > 0) return false;
  o.T[key] = Math.max(6, Math.round(period / D().fr));

}
// コアの移動（なめらかに from → to）

  c.dx = b.from[0] + (b.to[0] - b.from[0]) * e;
  c.dy = b.from[1] + (b.to[1] - b.from[1]) * e;
  return true;
}

// 封印型：砲台の撃破数から封印状態をその場で決める（同じ更新の後続弾にもすぐ反映される）
function fortSeal(f) {

// 1更新の間の自機（基準点を ox だけ前にずらす）と弾の最接近距離の2乗。

function stepGame() {
  G.t++;
  const lock = fort && (fort.state === 'dying' || (fort.state === 'alive' && fort.x <= 600 && !fort.released));
  G.scrollSpeed = lock ? 0 : BASE_SCROLL;
  G.scrollX += G.scrollSpeed;
  while (G.evIdx < G.events.length && G.scrollX >= G.events[G.evIdx].at) spawnEvent(G.events[G.evIdx++]);
  updatePlayer();
  if (state !== 'play') return;
  updateEnemies();
  if (fort) updateFort();
  if (boss) updateBoss();
  if (state !== 'play') return;
  updatePBullets();
  updateEBullets();
  updateCaps();
  updateParticles();
  if (banner && --banner.t <= 0) banner = null;
}
function update() {
  frameCount++;
  if (gpNotice && --gpNotice.t <= 0) gpNotice = null;
  if (!(state === 'play' && paused)) { updateStars(); nebX += 0.12; }
  if (shake > 0) { shake *= 0.88; if (shake < 0.3) shake = 0; }
  if (bombFlash > 0 && !(state === 'play' && paused)) bombFlash--;
  if (pressed.KeyM) { muted = !muted; applyMute(); }
  const start = pressed.KeyZ || pressed.Space || pressed.Enter || pressed.NumpadEnter;
  const gpOk = pressed.GpShot || pressed.GpStart;   // コントローラーの決定（A / X / START）
  const tap = pressed.TouchTap;                     // タッチ（プレイ中以外の画面タップ）
  switch (state) {
    case 'title':
      titleT++;
      if (start || gpOk || tap) newGame();
      break;
    case 'play':
      if (PAUSE_TOGGLES.some(k => pressed[k])) {
        paused = !paused;
        if (paused) discardTouchMove();   // 手動ポーズでも未消費のドラッグ量・指よけ補正は捨てる
        sfx('pause');
      }
      if (paused) { if (pressed.KeyR) newGame(); }
      else stepGame();
      break;
    case 'gameover':
      stateT++; updateParticles();
      // コントローラー／タッチは死亡直後の連打で画面を飛ばさないよう少し待ってから受け付ける
      if (pressed.KeyR || (stateT > 45 && (gpOk || tap))) newGame();
      break;
    case 'clear':
      // フォーカスを失っている間は自動遷移のタイマー（約5秒／20秒）を進めない（無操作で次面が始まらないように）
      if (!away) stateT++;
      updateParticles();
      if (G.final) {
        // エンディング：花火を上げつつ、Enter 等（または20秒後）で次の周回へ
        if (!away && stateT % 16 === 0 && stateT < 1100) launchFirework();   // タイマー停止中に同じ stateT で連発しないよう away 中は上げない
        updateFireworks();
        if ((stateT > 150 && (start || gpOk || tap)) || stateT > 1200) nextLoop();
      } else if ((stateT > 90 && (start || gpOk || tap)) || stateT > 300) nextStage();   // 5秒で自動的に次のステージへ
      break;
  }
  for (const k in pressed) delete pressed[k];
}

function poly(pts, color, flipY) {

  for (let i = 0; i < pts.length; i++) {
    const x = pts[i][0], y = flipY ? -pts[i][1] : pts[i][1];
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}
function drawBackground() {
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  const off = nebX % W;
  ctx.drawImage(neb, -off, 0, W, H);
  ctx.drawImage(neb, W - off, 0, W, H);
  for (const L of starLayers) {
    ctx.globalAlpha = L.a; ctx.fillStyle = L.c;
    for (const p of L.pts) ctx.fillRect(p.x, p.y, L.s, L.s);

const TX = new Float32Array(160), TF = new Float32Array(160), TC = new Float32Array(160);
function drawTerrain() {
  const off = G.scrollX % 8;

  for (let x = -off; x <= W + 8; x += 8) {   // 頂点をワールド座標の8px格子に固定（揺らぎ防止）
    const wx = x + G.scrollX, f = floorH(wx), c = ceilH(wx);
    TX[n] = x; TF[n] = H - f; TC[n] = c;
    if (f > maxF) maxF = f; if (c > maxC) maxC = c;
    n++;

  if (maxF > 0) {
    ctx.beginPath(); ctx.moveTo(TX[0], H);
    for (let i = 0; i < n; i++) ctx.lineTo(TX[i], TF[i]);
    ctx.lineTo(TX[n - 1], H); ctx.closePath();
    ctx.fillStyle = floorGrad; ctx.fill();
    ctx.lineWidth = 2;
    ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(TX[i], TF[i]) : ctx.moveTo(TX[i], TF[i]);
    ctx.strokeStyle = terLine; ctx.stroke();
    ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(TX[i], TF[i] + 12) : ctx.moveTo(TX[i], TF[i] + 12);
    ctx.strokeStyle = terLine2; ctx.stroke();
  }
  if (maxC > 0) {
    ctx.beginPath(); ctx.moveTo(TX[0], 0);
    for (let i = 0; i < n; i++) ctx.lineTo(TX[i], TC[i]);
    ctx.lineTo(TX[n - 1], 0); ctx.closePath();
    ctx.fillStyle = ceilGrad; ctx.fill();
    ctx.lineWidth = 2;
    ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(TX[i], TC[i]) : ctx.moveTo(TX[i], TC[i]);
    ctx.strokeStyle = terLine; ctx.stroke();
    ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(TX[i], TC[i] - 12) : ctx.moveTo(TX[i], TC[i] - 12);
    ctx.strokeStyle = terLine2; ctx.stroke();

}

function drawPlayer() {

function drawEnemy(e) {

      ctx.lineTo(-13, 0); ctx.lineTo(-3, -3); ctx.lineTo(0, -13); ctx.lineTo(3, -3);

      ctx.fillStyle = '#e8fffb'; circle(Math.cos(a) * 3, Math.sin(a) * 3, 5);
      ctx.fillStyle = '#ff3b5c'; circle(Math.cos(a) * 5, Math.sin(a) * 5, 2.4);
      break;

    case 'turret': {
      const flip = e.side === 'ceil';
      if (flip) ctx.scale(1, -1);

      ctx.save(); ctx.translate(0, -8); ctx.rotate(la);
      ctx.fillStyle = fl ? '#fff' : '#d9d2b8'; ctx.fillRect(0, -2.5, 17, 5);
      ctx.restore();

      ctx.fillStyle = '#6b4a20'; ctx.fillRect(-14, -3, 28, 5);

  else if (c.rage) col = pulse > 0.8 ? '#ffd0d0' : '#ff3b4e';

    ctx.fillStyle = c.guard ? (((frameCount >> 3) & 1) ? '#ff5a5a' : '#a02a2a') : '#6aff9a';

  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.t / 20); outlinedText(t.str, t.x, t.y, t.color); }
  ctx.globalAlpha = 1;
  // バナー（banner.t は stepGame でしか減らないので、プレイ中だけ描く）
  if (banner && state === 'play') {
    const a = Math.min(1, banner.t / 25, (200 - banner.t) / 20 + 0.2);
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 44px ' + FONT;
    const col = banner.warn ? (((frameCount >> 3) & 1) ? '#ff4d5e' : '#ffd0d0') : '#ffffff';
    outlinedText(banner.text, W / 2, 190, col);
    if (banner.sub) { ctx.font = 'bold 20px ' + FONT; outlinedText(banner.sub, W / 2, 236, '#ffe3a8'); }
    ctx.globalAlpha = 1;
  }
}
// 中ボス／ボスの弱点の状態（HUDに表示する文と色）
function structStatus(s) {
  if (s === boss) return s.state === 'enter' ? ['接近中 ─ 停止するまで攻撃は通らない', '#aab4d0'] : BOSSES[s.kind].status(s);
  if (s.kind === 'shutter') return s.core.guard ? ['シャッター閉鎖中 ─ 開くのを待て', '#aab4d0'] : ['コア露出中！', '#7fffd0'];
  // 封印型は二段階：①砲台 → ②防壁プレート → コア。プレートの残り枚数も常に出す
  const n = livePlates(s), pl = `防壁プレート 残り ${n}/${s.plates.length}`;
  if (s.turretsLeft > 0) return [`封印中：上の砲台 残り ${s.turretsLeft}/${s.turretsTotal}　${pl}`, '#ffd27a'];
  return n ? [`封印解除 ─ ${pl}：壊してコアを狙え`, '#ffe08a'] : ['封印解除・プレート全壊 ─ コアを撃て！', '#7fffd0'];
}
function dim(a) { ctx.fillStyle = `rgba(0,0,8,${a})`; ctx.fillRect(0, 0, W, H); }
function drawTitle() {
  drawShip(220 + Math.sin(titleT * 0.02) * 30, 380 + Math.sin(titleT * 0.035) * 14, Math.cos(titleT * 0.035) * 0.5);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const g = ctx.createLinearGradient(0, 100, 0, 170);
  g.addColorStop(0, '#e9f6ff'); g.addColorStop(0.5, '#6fc8ff'); g.addColorStop(1, '#2a5fd0');
  ctx.font = '900 70px ' + FONT;
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText('銀河ウォーズ', W / 2, 135);
  ctx.fillStyle = g; ctx.fillText('銀河ウォーズ', W / 2, 135);
  ctx.font = 'bold 20px ' + FONT; ctx.fillStyle = '#9fc3ff'; ctx.fillText('A Z U R E   V E C T O R', W / 2, 190);
  ctx.font = '16px ' + FONT; ctx.fillStyle = '#d8e4ff';
  const lines = ['移動：矢印キー / WASD　　ショット：Z / スペース（長押しで連射）',
                 'パワーアップ発動：X　ボム：C　ポーズ：P（ポーズ中にRでリスタート）　音のON/OFF：M',
                 'オレンジのカプセルを取るとゲージが進む。光っている項目をXで発動！',
                 'コントローラー：スティック/十字キーで移動　A・Xショット　B・Y発動　LB・RBボム　START/SELECTポーズ'];
  const showTouch = isTouchDev || touch.mode;
  if (showTouch) lines.push('スマホ：画面をドラッグで移動（触れている間は自動連射）　右下ボタンで発動・その左でボム　右上でポーズ');
  const ly0 = showTouch ? 250 : 262, lsp = showTouch ? 27 : 28;
  lines.forEach((l, i) => ctx.fillText(l, W / 2, ly0 + i * lsp));
  if (showTouch && window.innerHeight > window.innerWidth) {
    ctx.font = 'bold 14px ' + FONT; ctx.fillStyle = '#ffd27a';
    ctx.fillText('画面を横向きにすると遊びやすくなります', W / 2, 222);
  }
  if ((titleT >> 5) & 1 || titleT < 30) {
    ctx.font = 'bold 24px ' + FONT; ctx.fillStyle = '#ffd27a';
    ctx.fillText(showTouch ? 'タップ / Z / Enter / A / START でスタート' : 'Z / スペース / Enter / A / START でスタート', W / 2, 400);
  }
  ctx.font = '15px ' + FONT; ctx.fillStyle = '#9fb6e8';
  ctx.fillText('ハイスコア ' + pad(hiScore, 8), W / 2, 450);
  // コントローラー接続状態
  ctx.font = 'bold 15px ' + FONT;
  if (!hasGamepadAPI) {
    ctx.fillStyle = '#7f8fb8'; ctx.fillText('このブラウザはコントローラー非対応です', W / 2, 488);
  } else if (gpInfo.count > 0) {
    ctx.fillStyle = '#7fffd0';
    ctx.fillText('● コントローラー接続中' + (gpInfo.name ? '：' + gpInfo.name : ''), W / 2, 488);
    if (!gpInfo.standard) {
      ctx.font = '13px ' + FONT; ctx.fillStyle = '#ffd27a';
      ctx.fillText('（標準配列ではないため、ボタン配置が異なる場合があります）', W / 2, 512);
    }
  } else {
    ctx.fillStyle = '#7f8fb8'; ctx.fillText('コントローラー未接続（接続後、いずれかのボタンを押すと認識されます）', W / 2, 488);
  }
}
// 接続／切断の一時通知（どの画面でも上部に表示）
function drawGpNotice() {
  if (!gpNotice) return;
  ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
  ctx.globalAlpha = Math.min(1, gpNotice.t / 30);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 16px ' + FONT;
  outlinedText(gpNotice.str, W / 2, 46, '#7fffd0');
  ctx.globalAlpha = 1;
}
function render() {
  ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
  drawBackground();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  if (state === 'title' || !G) {
    ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
    drawTitle();
    return;
  }
  drawTerrain();
  if (fort) drawFort();
  drawCaps();
  for (const e of enemies) if (!e.dead) drawEnemy(e);   // 撃破済み（compact 前）の敵は爆発の上に描かない
  if (boss) drawBoss();
  drawPBullets();
  drawPlayer();
  drawEBullets();
  drawParticles();
  ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
  if (bombFlash > 0) {   // ボムの画面フラッシュ（白→金に退色）
    const k = bombFlash / 26;
    ctx.fillStyle = `rgba(255,${235 - 40 * (1 - k) | 0},${200 - 120 * (1 - k) | 0},${0.75 * k})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === 'play' && paused) {
    dim(0.55);
    ctx.font = '900 48px ' + FONT; outlinedText('ポーズ中', W / 2, H / 2 - 20, '#ffffff');
    ctx.font = 'bold 18px ' + FONT;
    outlinedText(touchUIOn() ? '右上の ▶ ボタン / P / START で再開　／　R で最初から' : 'P / START で再開　／　R で最初から', W / 2, H / 2 + 34, '#cfe0ff');
  } else if (state === 'gameover') {
    dim(Math.min(0.6, stateT / 60));
    ctx.font = '900 60px ' + FONT; outlinedText('ゲームオーバー', W / 2, H / 2 - 50, '#ff5a6e');
    ctx.font = 'bold 22px ' + FONT; outlinedText(`スコア ${pad(G.score, 8)}　STAGE ${G.stage}　第${G.loop}周`, W / 2, H / 2 + 14, '#ffffff');
    if (G.score > G.hiAtStart) outlinedText('ハイスコア更新！', W / 2, H / 2 + 46, '#ffd27a');   // 開始時のハイスコアを超えた時だけ（同点は出さない）
    if ((stateT >> 5) & 1) { ctx.font = 'bold 20px ' + FONT; outlinedText(touch.mode || isTouchDev ? 'タップ / R キー / A ボタンでリスタート' : 'R キー / A ボタンでリスタート', W / 2, H / 2 + 92, '#cfe0ff'); }
  } else if (state === 'clear' && G.final) {
    // エンディング（8ステージ制覇）
    dim(Math.min(0.62, stateT / 60));
    drawFireworks();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const g = ctx.createLinearGradient(0, H / 2 - 150, 0, H / 2 - 100);
    g.addColorStop(0, '#fff6d8'); g.addColorStop(0.5, '#ffd27a'); g.addColorStop(1, '#ff9a5a');
    ctx.font = '900 52px ' + FONT;
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText('全8ステージ制覇！', W / 2, H / 2 - 128);
    ctx.fillStyle = g; ctx.fillText('全8ステージ制覇！', W / 2, H / 2 - 128);
    ctx.font = 'bold 20px ' + FONT;
    outlinedText(`${G.lastBoss}は沈黙し、銀河に静けさが戻った。`, W / 2, H / 2 - 74, '#ffffff');
    outlinedText(`蒼穹ベクター隊、第${G.loop}周 任務完了 ─ CONGRATULATIONS`, W / 2, H / 2 - 46, '#9fc3ff');
    ctx.font = 'bold 20px ' + FONT;
    outlinedText(`ステージ・残機ボーナス +${G.bonus}`, W / 2, H / 2 - 6, '#ffe3a8');
    outlinedText(`全ステージ制覇ボーナス +${G.allBonus}`, W / 2, H / 2 + 22, '#ffe3a8');
    ctx.font = '900 30px ' + FONT;
    outlinedText(`最終スコア ${pad(G.score, 8)}`, W / 2, H / 2 + 62, '#ffffff');
    ctx.font = 'bold 18px ' + FONT;
    outlinedText(`ハイスコア ${pad(Math.max(hiScore, G.score), 8)}　残機 ${Math.max(0, G.lives)}`, W / 2, H / 2 + 96, '#ffd27a');
    if (stateT > 150 && ((stateT >> 5) & 1)) {
      outlinedText(`${touch.mode || isTouchDev ? 'タップ / ' : ''}Z / Enter / A ボタンで第${G.loop + 1}周へ（ステージ1から・難易度アップ）`, W / 2, H / 2 + 140, '#cfe0ff');
    }
  } else if (state === 'clear') {
    dim(Math.min(0.55, stateT / 60));
    ctx.font = '900 54px ' + FONT; outlinedText(`STAGE ${G.stage} クリア！`, W / 2, H / 2 - 70, '#7fffd0');
    ctx.font = 'bold 22px ' + FONT;
    outlinedText(`${G.lastBoss || 'ボス'}を撃破した`, W / 2, H / 2 - 16, '#ffffff');
    outlinedText(`ステージ・残機ボーナス +${G.bonus}`, W / 2, H / 2 + 18, '#ffe3a8');
    outlinedText(`スコア ${pad(G.score, 8)}`, W / 2, H / 2 + 52, '#ffffff');
    const nx = STAGES[G.stage];
    if (nx) { ctx.font = 'bold 18px ' + FONT; outlinedText(`次は STAGE ${G.stage + 1}「${nx.name}」`, W / 2, H / 2 + 86, '#9fc3ff'); }
    if (stateT > 90 && ((stateT >> 5) & 1)) {
      ctx.font = 'bold 18px ' + FONT;
      outlinedText(`${touch.mode || isTouchDev ? 'タップ / ' : ''}Z / Enter / A ボタンで次のステージへ`, W / 2, H / 2 + 118, '#cfe0ff');
    }
  }
  drawTouchUI();
}
// タッチ用ボタン（プレイ中かつタッチ操作中だけ表示。指でドラッグ中はキー／パッドに触れても出し続ける）
function drawTouchUI() {
  if (!touchUIOn() || state !== 'play') return;
  const L = tbtnLayout(), ps = L.pause, pw = L.pwr;
  ctx.save();
  ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
  // 右上：ポーズ（ポーズ中は再開マーク）
  ctx.fillStyle = 'rgba(8,16,44,0.55)'; ctx.fillRect(ps.x, ps.y, ps.s, ps.s);
  ctx.strokeStyle = 'rgba(150,190,255,0.75)'; ctx.lineWidth = 2; ctx.strokeRect(ps.x + 1, ps.y + 1, ps.s - 2, ps.s - 2);
  const cx = ps.x + ps.s / 2, cy = ps.y + ps.s / 2, u = ps.s * 0.16;
  ctx.fillStyle = '#dfe9ff';
  if (paused) {
    ctx.beginPath(); ctx.moveTo(cx - u * 1.2, cy - u * 1.7); ctx.lineTo(cx + u * 1.7, cy); ctx.lineTo(cx - u * 1.2, cy + u * 1.7); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillRect(cx - u * 1.4, cy - u * 1.7, u, u * 3.4); ctx.fillRect(cx + u * 0.4, cy - u * 1.7, u, u * 3.4);
  }
  // 右下：パワーアップ発動（発動できる項目が光っているときは点滅）
  const ready = P.alive && P.gauge >= 0 && canActivate(P.gauge);
  const pulse = 0.65 + 0.35 * Math.sin(frameCount * 0.25);
  ctx.globalAlpha = paused ? 0.4 : 1;
  ctx.fillStyle = ready ? `rgba(255,150,40,${0.35 + 0.3 * pulse})` : 'rgba(8,16,44,0.5)';
  ctx.beginPath(); ctx.arc(pw.x, pw.y, pw.r, 0, TAU); ctx.fill();
  ctx.strokeStyle = ready ? '#ffe9b0' : 'rgba(150,190,255,0.6)'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = ready ? '#fff4d8' : 'rgba(200,215,255,0.75)';
  if (P.gauge >= 0) {
    ctx.font = `bold ${Math.round(pw.r * 0.32)}px ${FONT}`; ctx.fillText(PW_LABELS[P.gauge], pw.x, pw.y - pw.r * 0.16);
    ctx.font = `bold ${Math.round(pw.r * 0.26)}px ${FONT}`; ctx.fillText('発動', pw.x, pw.y + pw.r * 0.32);
  } else {
    ctx.font = `bold ${Math.round(pw.r * 0.34)}px ${FONT}`; ctx.fillText('発動', pw.x, pw.y);
  }
  // 発動ボタンの左：ボム（所持数を表示。所持していれば金色）
  const bm = L.bomb, has = P.alive && P.bombs > 0;
  ctx.fillStyle = has ? 'rgba(255,200,80,0.42)' : 'rgba(8,16,44,0.5)';
  ctx.beginPath(); ctx.arc(bm.x, bm.y, bm.r, 0, TAU); ctx.fill();
  ctx.strokeStyle = has ? '#ffe9b0' : 'rgba(150,190,255,0.6)'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = has ? '#fff4d8' : 'rgba(200,215,255,0.75)';
  ctx.font = `bold ${Math.round(bm.r * 0.4)}px ${FONT}`; ctx.fillText('ボム', bm.x, bm.y - bm.r * 0.2);
  ctx.font = `bold ${Math.round(bm.r * 0.36)}px ${FONT}`; ctx.fillText('×' + P.bombs, bm.x, bm.y + bm.r * 0.36);
  ctx.restore();
}

// ============================================================
//  メインループ：固定ステップ60Hz更新 + rAF描画
// ============================================================
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(now - last, 250);
  last = now;
  let n = 0;
  // 60Hzモニタのタイミング揺らぎで更新回数が0/2回にぶれないよう1ms許容
  pollGamepads();
  while (acc >= STEP - 1 && n < 5) { update(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  try { musicUpdate(); } catch (err) { /* BGMが鳴らなくてもゲームは続行 */ }
  render();
  drawGpNotice();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 今狙うべき部位（画面座標）。動作確認用：装置 → 装甲板 → ダメージの通るコア → 残っているコア の順
function weakPoint() {
  const s = boss && (boss.state === 'fight' || boss.state === 'enter') ? boss : (fort && fort.state === 'alive' ? fort : null);
  if (!s) return null;
  if (s === fort && fort.kind === 'turret' && fort.turretsLeft > 0) {
    for (const e of enemies) if (!e.dead && e.mount && e.mount.obj === fort) return { x: e.cx, y: e.cy, part: 'turret' };
  }
  for (const v of s.devices) if (!v.dead) return { x: s.x + v.dx, y: s.oy + v.dy, part: 'device' };
  for (const p of s.plates) if (p.hp > 0) return { x: s.x + p.dx, y: s.oy + p.dy + p.h / 2, part: 'plate' };
  let any = null;
  for (const c of s.cores) {
    if (c.hp <= 0) continue;
    const pt = { x: s.x + c.dx, y: s.oy + c.dy, part: 'core', open: !c.guard && !c.hidden && s.state !== 'enter' };
    if (pt.open) return pt;
    any = any || pt;
  }
  return any;
}
// 動作確認用の読み取り口（ゲーム進行には影響なし）
// fort = 現在の中ボス、boss = 現在のボス、G.stage = 現在のステージ（1〜8）。weak = 今狙うべき部位の座標
window.__azureVector = { get state() { return state; }, get G() { return G; }, get P() { return P; },
                         get fort() { return fort; }, get boss() { return boss; }, get weak() { return weakPoint(); },
                         get stage() { return G ? G.stage : 0; }, STAGES, enemies, ebul, pbul, caps };
})();
