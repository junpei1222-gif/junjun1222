<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="銀河ウォーズ">
<meta name="theme-color" content="#05070f">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>銀河ウォーズ — GALAXY WARS</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
               touch-action: none; overscroll-behavior: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
               -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center;
         position: fixed; left: 0; top: 0; right: 0; bottom: 0; }
  canvas { display: block; background: #02030a; outline: none; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script>
(() => {
'use strict';

// ============================================================
//  基本設定
// ============================================================
const W = 960, H = 540;
const STEP = 1000 / 60;            // 固定ステップ（60更新/秒）
const TAU = Math.PI * 2;
const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif';
const BASE_SCROLL = 1.6;           // 強制スクロール速度(px/フレーム)
const FORT_WX = 4300;              // 要塞のワールドX
const BOSS_AT = 8700;              // ボス出現スクロール位置
const OPT_GAP = 12;                // オプションの追従間隔（移動履歴フレーム数）
const SHIELD_HP = 6;
const PW_LABELS = ['スピード', 'ミサイル', 'ダブル', 'レーザー', 'オプション', 'シールド'];
const PW_NAMES  = ['スピードアップ！', 'ミサイル装備！', 'ダブル装備！', 'レーザー装備！', 'オプション追加！', 'シールド展開！'];

const cv = document.getElementById('c');
const ctx = cv.getContext && cv.getContext('2d');
if (!ctx) {
  // Canvas 2D が使えない環境ではメッセージを出して起動を止める
  const msg = document.createElement('p');
  msg.textContent = 'このブラウザでは Canvas 2D を利用できないため、ゲームを起動できません。別のブラウザでお試しください。';
  msg.style.cssText = 'color:#fff;font:16px sans-serif;padding:24px;text-align:center;max-width:640px;line-height:1.7;';
  cv.replaceWith(msg);
  return;
}
let scaleX = 1, scaleY = 1;
let cssScale = 1;                  // 表示上のCSSピクセル / ゲーム座標（タッチUIの大きさ計算に使う）

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
  cv.width = Math.max(1, Math.round(cw * dpr));
  cv.height = Math.max(1, Math.round(ch * dpr));
  scaleX = cv.width / W;
  scaleY = cv.height / H;
  cssScale = cw / W;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

// ============================================================
//  ユーティリティ
// ============================================================
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function circRect(cx, cy, r, x, y, w, h) {
  const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy <= r * r;
}
function rectRect(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function compact(a) { let j = 0; for (let i = 0; i < a.length; i++) { const o = a[i]; if (!o.dead) a[j++] = o; } a.length = j; }
function pad(n, len) { return String(Math.floor(n)).padStart(len, '0'); }

// ============================================================
//  入力（ゲームで使うキーはすべて preventDefault）
// ============================================================
const keys = {}, pressed = {};
const GAME_CODES = new Set([
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyZ', 'KeyX', 'KeyP', 'KeyR', 'KeyM',
  'Space', 'Enter', 'NumpadEnter', 'Escape'
]);
window.addEventListener('keydown', e => {
  initAudio();                   // ゲームで使わないキーでも音声の解放を試みる（パッドだけの環境向け）
  if (!GAME_CODES.has(e.code)) return;
  e.preventDefault();
  touch.mode = false;            // キーボードを使い始めたらタッチ用ボタンは隠す（指で操作中は drawTouchUI 側で表示を保つ）
  // キーリピートは新規押下にしない（自動ポーズで keys を消した後の押しっぱなしで解除されないように）
  if (!keys[e.code] && !e.repeat) pressed[e.code] = true;
  keys[e.code] = true;
}, { passive: false });
window.addEventListener('keyup', e => {
  if (!GAME_CODES.has(e.code)) return;
  e.preventDefault();
  keys[e.code] = false;
}, { passive: false });
// クリック／タップでも AudioContext の再開を試みる
for (const ev of ['pointerdown', 'mousedown', 'click']) window.addEventListener(ev, () => initAudio());
// ポーズを切り替える入力（全入力元）。自動ポーズの瞬間に届いていたものはここで捨てる
const PAUSE_TOGGLES = ['KeyP', 'Escape', 'GpStart', 'GpSelect', 'TouchPause'];
function discardTouchMove() { touch.accX = touch.accY = touch.adjY = 0; }
// 自動ポーズ（フォーカス喪失・パッド切断）の共通処理
function autoPause() {
  for (const k of PAUSE_TOGGLES) delete pressed[k];
  discardTouchMove();
  if (state === 'play') paused = true;
}
function releaseAll() {
  for (const k in keys) keys[k] = false;
  for (const k in pressed) delete pressed[k];   // 押下履歴も消す
  touchReset();
  gpRebase = true;
  autoPause();
}
window.addEventListener('blur', releaseAll);
// フォーカス復帰後の最初のサンプルをゲームパッドの基準にする（押しっぱなしのSTARTを新規押下と見なさない）
window.addEventListener('focus', () => { gpRebase = true; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    releaseAll();
    // 裏に回ったら音も止める（BGMのスケジューラが間引かれて崩れないように）
    if (AC && AC.state === 'running') { const r = AC.suspend(); if (r && r.catch) r.catch(() => {}); }
  } else {
    gpRebase = true;
    if (AC && AC.state !== 'running' && AC.state !== 'closed') { const r = AC.resume(); if (r && r.catch) r.catch(() => {}); }
  }
});
window.addEventListener('load', () => cv.focus());

// ============================================================
//  タッチ操作（スマートフォン）
//  ・ボタン以外をドラッグ → 自機が指の移動量だけ相対移動。タッチ中は自動連射
//  ・指が自機に重なる位置で触れたら、自機を指の少し上へ寄せて隠れないようにする
//  ・右下：パワーアップ発動、右上：ポーズ（プレイ中、タッチ操作時のみ表示）
//  レターボックスの黒帯も含め画面全体で受け付け、スクロール／ズームは止める。
// ============================================================
const isTouchDev = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const TOUCH_SENS = 1.0;            // 指の移動量 → 自機の移動量の倍率
const TOUCH_MAX_STEP = 32;         // 1更新あたりの最大移動量（残りは次の更新へ繰り越し）
const TOUCH_LIFT_CSS = 50;         // 自機を指より上へずらす量（画面上のCSSピクセル）
const touch = { mode: false, dragId: null, lx: 0, ly: 0, accX: 0, accY: 0, adjY: 0 };
function touchReset() { touch.dragId = null; touch.accX = touch.accY = touch.adjY = 0; }
// タッチ用ボタンを出すか（キー／パッドに触れても、追跡中の指がある間は出し続ける）
function touchUIOn() { return touch.mode || touch.dragId !== null; }
function toGame(t) {
  const r = cv.getBoundingClientRect();
  return { x: (t.clientX - r.left) * W / (r.width || 1), y: (t.clientY - r.top) * H / (r.height || 1) };
}
// ボタン配置（ゲーム座標）。画面が小さいほどゲーム座標上は大きくして、指で押せる大きさを保つ
function tbtnLayout() {
  const k = 1 / (cssScale || 1);
  const r = clamp(34 * k, 40, 84), s = clamp(44 * k, 44, 90);
  return { pwr: { x: W - r - 16, y: H - r - 44, r }, pause: { x: W - s - 10, y: 8, s } };
}
function hitPause(p, L) { const b = L.pause, m = 12; return p.x >= b.x - m && p.x <= b.x + b.s + m && p.y >= b.y - m && p.y <= b.y + b.s + m; }
function hitPower(p, L) { const b = L.pwr; return Math.hypot(p.x - b.x, p.y - b.y) <= b.r + 12; }
function onTouchStart(e) {
  e.preventDefault();
  initAudio();
  touch.mode = true;
  // 取りこぼした touchend 対策：追跡中の指がもう画面に無ければ解放
  if (touch.dragId !== null && !Array.prototype.some.call(e.touches, t => t.identifier === touch.dragId)) touch.dragId = null;
  for (const t of e.changedTouches) {
    const p = toGame(t);
    if (state === 'play') {
      const L = tbtnLayout();
      if (hitPause(p, L)) { pressed.TouchPause = true; continue; }
      if (!paused && hitPower(p, L)) { pressed.TouchPower = true; continue; }
    } else {
      pressed.TouchTap = true;     // タイトルでスタート／ゲームオーバー・クリア後に進む
    }
    if (touch.dragId === null) {
      touch.dragId = t.identifier; touch.lx = p.x; touch.ly = p.y;
      touch.accX = touch.accY = 0;
      // 固定更新の間に収まる短いタップでも1発は撃てるよう押下を記録（ボタン領域は上で continue 済み）
      if (state === 'play' && !paused) pressed.TouchShot = true;
      // 指が自機の上か少し下に触れたら、自機を指の上 TOUCH_LIFT_CSS へ寄せる（数フレームかけて）
      if (state === 'play' && !paused && P && P.alive) {
        const lift = TOUCH_LIFT_CSS / (cssScale || 1);
        if (Math.abs(p.x - P.x) < 60 && p.y > P.y - 30 && p.y < P.y + lift) touch.adjY = (p.y - lift) - P.y;
        else touch.adjY = 0;
      }
    }
  }
}
function onTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== touch.dragId) continue;
    const p = toGame(t);
    if (state === 'play' && !paused) {
      touch.accX += (p.x - touch.lx) * TOUCH_SENS;
      touch.accY += (p.y - touch.ly) * TOUCH_SENS;
    }
    touch.lx = p.x; touch.ly = p.y;
  }
}
function onTouchEnd(e) {
  e.preventDefault();
  initAudio();                     // iOS は touchend でのオーディオ解放が確実
  for (const t of e.changedTouches) if (t.identifier === touch.dragId) touch.dragId = null;
}
function onTouchCancel(e) {
  e.preventDefault();
  // キャンセルされたドラッグの未消費の移動量・指よけ補正は捨てる（勝手に動き続けないように）
  for (const t of e.changedTouches) if (t.identifier === touch.dragId) touchReset();
}
document.addEventListener('touchstart', onTouchStart, { passive: false });
document.addEventListener('touchmove', onTouchMove, { passive: false });
document.addEventListener('touchend', onTouchEnd, { passive: false });
document.addEventListener('touchcancel', onTouchCancel, { passive: false });
// iOS Safari のピンチ（gesture*）、長押しメニュー、ダブルタップズームを止める
for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) {
  document.addEventListener(ev, e => e.preventDefault(), { passive: false });
}
document.addEventListener('contextmenu', e => { if (touch.mode) e.preventDefault(); });

// ============================================================
//  ゲームパッド（Gamepad API・標準マッピング想定）
//  rAFごとに1回ポーリングし、保持状態は gpad、押下エッジは pressed の Gp* に入れる。
//  pressed は update() の最後に消えるので、更新0回のフレームでもエッジは次の更新まで残る。
// ============================================================
const GP_DEAD = 0.25;
const GP_BTN = { A: 0, B: 1, X: 2, Y: 3, SELECT: 8, START: 9, UP: 12, DOWN: 13, LEFT: 14, RIGHT: 15 };
const gpad = { ax: 0, ay: 0, up: false, down: false, left: false, right: false, shot: false };
const gpPrev = new Map();          // gamepad.index -> 前回のボタン押下配列
const gpInfo = { count: 0, name: '', standard: true };
let gpNotice = null;               // 接続／切断の一時表示 { str, t }
let gpRebase = false;              // true なら次のサンプルは基準取りだけ（押下エッジを出さない）
const hasGamepadAPI = typeof navigator.getGamepads === 'function';
function getPads() {
  if (!hasGamepadAPI) return [];
  let list;
  try { list = navigator.getGamepads(); } catch (err) { return []; }
  const out = [];
  if (list) for (const g of list) if (g && g.connected !== false) out.push(g);
  return out;
}
function btnDown(g, i) {
  const b = g.buttons[i];
  if (!b) return false;
  return typeof b === 'object' ? (b.pressed || b.value > 0.5) : b > 0.5;
}
function shortPadName(id) {
  const s = String(id || '').replace(/\s*\((?:STANDARD GAMEPAD\s*)?Vendor:.*$/i, '').replace(/\s+/g, ' ').trim();
  return s.length > 28 ? s.slice(0, 27) + '…' : s;
}
function pollGamepads() {
  gpad.ax = gpad.ay = 0;
  gpad.up = gpad.down = gpad.left = gpad.right = gpad.shot = false;
  const all = getPads();
  // 標準マッピングのものを優先。無ければ非標準の先頭1台だけを使う（軸・ボタン配置が違う可能性あり）
  const std = all.filter(g => g.mapping === 'standard');
  const use = std.length ? std : all.slice(0, 1);
  gpInfo.count = all.length;
  gpInfo.standard = !all.length || std.length > 0;
  gpInfo.name = use.length ? shortPadName(use[0].id) : '';
  // フォーカス復帰直後などは、このサンプルを基準にし直すだけで押下エッジは出さない
  const rebase = gpRebase;
  gpRebase = false;
  const seen = new Set();
  for (const g of use) {
    seen.add(g.index);
    const prev = gpPrev.get(g.index) || [];
    const now = [];
    for (let i = 0; i < g.buttons.length; i++) now[i] = btnDown(g, i);
    const edge = i => !rebase && now[i] && !prev[i];
    let any = false;
    for (let i = 0; i < now.length; i++) if (edge(i)) { any = true; break; }
    if (any) { initAudio(); touch.mode = false; }
    if (edge(GP_BTN.A) || edge(GP_BTN.X)) pressed.GpShot = true;
    if (edge(GP_BTN.B) || edge(GP_BTN.Y)) pressed.GpPower = true;
    if (edge(GP_BTN.START)) pressed.GpStart = true;
    if (edge(GP_BTN.SELECT)) pressed.GpSelect = true;
    if (now[GP_BTN.A] || now[GP_BTN.X]) gpad.shot = true;
    if (now[GP_BTN.UP]) gpad.up = true;
    if (now[GP_BTN.DOWN]) gpad.down = true;
    if (now[GP_BTN.LEFT]) gpad.left = true;
    if (now[GP_BTN.RIGHT]) gpad.right = true;
    // 左スティック：円形デッドゾーン → 残りを0〜1に再スケール（倒し具合で速度が変わる）
    const x = +g.axes[0] || 0, y = +g.axes[1] || 0, m = Math.hypot(x, y);
    if (m > GP_DEAD) {
      const k = Math.min(1, (m - GP_DEAD) / (1 - GP_DEAD)) / m;
      if (Math.abs(x * k) > Math.abs(gpad.ax)) gpad.ax = x * k;
      if (Math.abs(y * k) > Math.abs(gpad.ay)) gpad.ay = y * k;
    }
    gpPrev.set(g.index, now);
  }
  // 複数台の軸ごとの最大値を合成すると斜めで長さが1を超えるので、ベクトル長を1に制限
  const am = Math.hypot(gpad.ax, gpad.ay);
  if (am > 1) { gpad.ax /= am; gpad.ay /= am; }
  for (const i of gpPrev.keys()) if (!seen.has(i)) gpPrev.delete(i);
}
if (hasGamepadAPI) {
  window.addEventListener('gamepadconnected', e => {
    gpNotice = { str: 'コントローラー接続：' + (shortPadName(e.gamepad && e.gamepad.id) || 'ゲームパッド'), t: 180 };
  });
  window.addEventListener('gamepaddisconnected', e => {
    if (e.gamepad) gpPrev.delete(e.gamepad.index);
    gpNotice = { str: 'コントローラーが切断されました', t: 180 };
    // プレイ中に最後の1台が抜けたら自動ポーズ
    if (state === 'play' && getPads().length === 0) autoPause();
  });
}

// ============================================================
//  効果音（WebAudioで合成。外部ファイルなし）
// ============================================================
let AC = null, master = null, muteBus = null, noiseBuf = null, muted = false;
const sfxLast = {};
let lastLaserSfx = -99;
function initAudio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try {
      AC = new C();
      // 効果音（master）とBGM（musicBus）は共通の消音用ノードを通す（予約済みの音も M で止まるように）
      muteBus = AC.createGain(); muteBus.gain.value = muted ? 0 : 1; muteBus.connect(AC.destination);
      master = AC.createGain(); master.gain.value = 0.35; master.connect(muteBus);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (err) { AC = null; return; }
    try {
      musicBus = AC.createGain(); musicBus.gain.value = MUSIC_VOL; musicBus.connect(muteBus);
      music.waves = { lead: pulseWave(0.25), arp: pulseWave(0.125), bass: 'square' };
    } catch (err) { musicBus = null; }
  }
  // iOS は 'interrupted' になることもあるので running 以外はすべて再開を試みる
  if (AC.state !== 'running' && AC.state !== 'closed') { const r = AC.resume(); if (r && r.catch) r.catch(() => {}); }
}
function applyMute() {
  if (!AC || !muteBus) return;
  try {
    const t = AC.currentTime, g = muteBus.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(muted ? 0 : 1, t + 0.02);
  } catch (err) { /* 音量変更に失敗してもゲームは続行 */ }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + Math.min(dur, 0.99));
}
function sfx(n) {
  if (!AC || muted || AC.state !== 'running') return;
  if (sfxLast[n] === frameCount) return;
  sfxLast[n] = frameCount;
  try {
    switch (n) {
      case 'shot': tone('square', 1100, 520, 0.05, 0.03); break;
      case 'laser':
        if (frameCount - lastLaserSfx < 8) return;
        lastLaserSfx = frameCount; tone('sawtooth', 1700, 1000, 0.07, 0.022); break;
      case 'hit': tone('square', 320, 200, 0.04, 0.03); break;
      case 'tink': tone('triangle', 2100, 1500, 0.03, 0.02); break;
      case 'pop': noise(0.25, 0.22, 2600); break;
      case 'boom': noise(0.6, 0.4, 1800); tone('sine', 130, 40, 0.5, 0.25); break;
      case 'death': noise(0.95, 0.5, 3000); tone('sawtooth', 420, 50, 0.8, 0.15); break;
      case 'cap': tone('square', 660, 1320, 0.12, 0.05); break;
      case 'power': tone('square', 523, 523, 0.07, 0.05); tone('square', 784, 784, 0.07, 0.05, 0.07); tone('square', 1046, 1046, 0.12, 0.05, 0.14); break;
      case 'deny': tone('square', 170, 120, 0.1, 0.04); break;
      case 'shield': tone('triangle', 900, 300, 0.1, 0.05); break;
      case 'warn': tone('sawtooth', 440, 440, 0.35, 0.05); tone('sawtooth', 330, 330, 0.35, 0.05, 0.4); break;
      case 'extend': tone('square', 880, 1760, 0.3, 0.05); break;
      case 'eshot': tone('triangle', 520, 300, 0.06, 0.02); break;
      case 'pause': tone('sine', 600, 600, 0.08, 0.05); break;
      case 'fanfare':
        tone('square', 523, 523, 0.11, 0.045); tone('square', 659, 659, 0.11, 0.045, 0.12);
        tone('square', 784, 784, 0.11, 0.045, 0.24); tone('square', 1046, 1046, 0.5, 0.05, 0.36); break;

// ============================================================
//  BGM（WebAudioで合成するチップチューン風ループ。外部ファイルなし）
//  16分音符単位のステップシーケンサ。AudioContext の時刻で少し先読みして予約する。
//  ・通常曲 'main'（Aマイナー 150BPM・8小節：メロディ4小節＋アルペジオ4小節）
//  ・ボス曲 'boss'（Dマイナー 162BPM・8小節：16分刻みのベースで緊張感）
//  ・再生開始はスタート操作（newGame）以降。ゲームオーバー／クリア／ボス撃破演出で止め、
//    リスタート・次の周回で頭から再開。ポーズ中は音量を絞る。M キーの消音で一緒に止まる。
// ============================================================
const MUSIC_VOL = 0.15;            // BGM全体の音量（効果音より控えめ）
const MV = { lead: 0.04, arp: 0.026, bass: 0.04, kick: 0.2, snare: 0.06, hat: 0.022 };
let musicBus = null, musicArmed = false, musicRestart = false;
const music = { cur: null, node: null, echo: null, extra: null, step: 0, next: 0, duck: false, waves: null,
                fading: [] };      // フェードアウト中の旧曲 { gain, nodes, timer }
const ARP = [0, 1, 2, 3, 2, 1, 0, 1, 2, 3, 2, 1, 0, 1, 2, 3];
function pulseWave(duty) {
  // デューティ比 duty の矩形波（ファミコン風のパルス波）をフーリエ級数で作る
  try {
    const n = 48, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * duty);
    return AC.createPeriodicWave(re, im);
  } catch (err) { return 'square'; }
}
// chords: [ベースの根音, 和音構成音×3]（MIDI番号）。mel: [ステップ, 音, 長さ(16分)]
function buildTrack(o) {
  const len = o.bars * 16, lead = new Array(len);
  for (const [s, m, l] of o.mel) lead[s] = [m, l, 'lead'];
  for (let bar = o.melBars; bar < o.bars; bar++) {
    const ch = o.chords[bar % o.chords.length], tones = [ch[1], ch[2], ch[3], ch[1] + 12];
    for (let i = 0; i < 16; i++) lead[bar * 16 + i] = [tones[ARP[i]], 1, 'arp'];
  }
  return Object.assign({ len, lead }, o);
}
const TRACKS = {
  main: buildTrack({
    bpm: 150, bars: 8, melBars: 4, bassLen: 1.6,
    chords: [[45, 69, 72, 76], [41, 69, 72, 77], [43, 67, 71, 74], [40, 68, 71, 76]],   // Am F G E
    mel: [
      [0, 69, 2], [2, 72, 2], [4, 76, 2], [6, 81, 4], [10, 79, 2], [12, 76, 4],
      [16, 77, 3], [19, 76, 1], [20, 72, 2], [22, 69, 2], [24, 72, 2], [26, 77, 2], [28, 76, 4],
      [32, 67, 2], [34, 71, 2], [36, 74, 2], [38, 79, 4], [42, 77, 2], [44, 74, 4],
      [48, 76, 2], [50, 80, 2], [52, 83, 4], [56, 80, 2], [58, 76, 2], [60, 71, 2], [62, 68, 2]
    ],
    // 8分音符で根音とオクターブ上を交互に刻む
    bass: (s, ch) => (s % 2) ? null : ch[0] + ((s % 4) ? 12 : 0),
    drum: (s) => {
      const b = s % 16;
      if (s >= 112 && b >= 13) return 'snare';            // 8小節目の終わりにフィル
      if (b === 0 || b === 6 || b === 8) return 'kick';
      if (b === 4 || b === 12) return 'snare';
      return (b % 2 === 0) ? 'hat' : null;
    }
  }),
  boss: buildTrack({
    bpm: 162, bars: 8, melBars: 4, bassLen: 0.8,
    chords: [[38, 62, 65, 69], [38, 62, 65, 69], [34, 62, 65, 70], [33, 61, 64, 69]],   // Dm Dm B♭ A
    mel: [
      [0, 81, 3], [3, 82, 1], [4, 81, 2], [6, 77, 2], [8, 74, 4], [12, 76, 2], [14, 77, 2],
      [16, 79, 3], [19, 77, 1], [20, 76, 2], [22, 73, 2], [24, 74, 6], [30, 69, 2],
      [32, 77, 3], [35, 79, 1], [36, 77, 2], [38, 74, 2], [40, 70, 4], [44, 74, 2], [46, 77, 2],
      [48, 76, 4], [52, 73, 4], [56, 69, 2], [58, 73, 2], [60, 76, 2], [62, 79, 2]
    ],
    // 16分で根音を刻み、ところどころオクターブ上へ跳ねる
    bass: (s, ch) => ch[0] + [0, 0, 12, 0, 0, 0, 12, 0, 0, 0, 12, 0, 0, 12, 0, 12][s % 16],
    drum: (s) => {
      const b = s % 16;
      if ((s % 64) >= 48 && b >= 13) return 'snare';
      if (b === 4 || b === 12) return 'snare';            // b%4===0 より先に判定（裏拍のスネアを消さない）
      if (b % 4 === 0) return 'kick';
      return (b % 2) ? 'hat' : null;
    }
  })
};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function mOsc(dests, kind, midi, t, dur, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  const w = music.waves && music.waves[kind];
  if (w && typeof w !== 'string') o.setPeriodicWave(w); else o.type = w || 'square';
  o.frequency.setValueAtTime(mtof(midi), t);
  // アタック → 減衰 → ゆるい持続 → 短いリリース
  const a = t + 0.005, d = t + Math.max(0.012, Math.min(dur * 0.5, 0.06)), r = t + Math.max(dur, d - t + 0.02);
  const rel = Math.max(d + 0.005, r - 0.03);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, a);
  g.gain.linearRampToValueAtTime(vol * 0.65, d);
  g.gain.linearRampToValueAtTime(vol * 0.45, rel);
  g.gain.exponentialRampToValueAtTime(0.0001, r);
  o.connect(g);
  for (const dst of dests) if (dst) g.connect(dst);
  o.start(t); o.stop(r + 0.02);
}
function mNoise(dest, t, dur, vol, type, freq) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function mKick(dest, t, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + 0.15);
}
function musicStop(fade) {
  const m = music;
  m.cur = null;
  if (!m.node) return;
  const f = { gain: m.node.gain, nodes: [m.node, m.echo].concat(m.extra || []), timer: 0 };
  const t = AC.currentTime, gn = f.gain;
  gn.cancelScheduledValues(t); gn.setValueAtTime(gn.value, t); gn.linearRampToValueAtTime(0, t + fade);
  f.timer = setTimeout(() => musicDrop(f), (fade + 1) * 1000);
  m.fading.push(f);
  m.node = m.echo = m.extra = null;
}
function musicDrop(f) {
  clearTimeout(f.timer);
  for (const n of f.nodes) { try { n.disconnect(); } catch (err) { /* 既に切断済み */ } }
  const i = music.fading.indexOf(f);
  if (i >= 0) music.fading.splice(i, 1);
}
// 新曲の開始時、フェードアウト中の旧曲を短く絞って切る（ゲームオーバー直後のリスタートで重ならないように）
function musicCutFades() {
  const t = AC.currentTime;
  for (const f of music.fading) {
    try { const g = f.gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + 0.03); }
    catch (err) { /* 失敗しても下の切断で止まる */ }
    clearTimeout(f.timer);
    f.timer = setTimeout(() => musicDrop(f), 120);
  }
}
function musicStart(name) {
  musicCutFades();
  musicStop(0.06);
  const T = TRACKS[name], sd = 60 / T.bpm / 4;
  const node = AC.createGain(); node.gain.value = 1; node.connect(musicBus);
  // メロディ用の簡易エコー（付点8分ディレイ）
  const echo = AC.createDelay(1), fb = AC.createGain(), wet = AC.createGain();
  echo.delayTime.value = sd * 3; fb.gain.value = 0.3; wet.gain.value = 0.35;
  echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(node);
  Object.assign(music, { cur: name, node, echo, extra: [fb, wet], step: 0, next: AC.currentTime + 0.06 });
}
function musicSchedule() {
  const T = TRACKS[music.cur], sd = 60 / T.bpm / 4, now = AC.currentTime;
  if (music.next < now - 0.05) music.next = now + 0.03;     // 大きく遅れたら（処理落ち等）今から刻み直す
  while (music.next < now + 0.2) {
    const s = music.step, t = music.next, out = music.node;
    const ch = T.chords[((s / 16) | 0) % T.chords.length];
    const bn = T.bass(s, ch);
    if (bn != null) mOsc([out], 'bass', bn, t, sd * T.bassLen, MV.bass);
    const ln = T.lead[s];
    if (ln) mOsc(ln[2] === 'lead' ? [out, music.echo] : [out], ln[2], ln[0], t, sd * ln[1] * 0.92, MV[ln[2]]);
    const dr = T.drum(s);
    if (dr === 'kick') mKick(out, t, MV.kick);
    else if (dr === 'snare') mNoise(out, t, 0.09, MV.snare, 'bandpass', 1900);
    else if (dr === 'hat') mNoise(out, t, 0.03, MV.hat, 'highpass', 7000);
    music.step = (s + 1) % T.len;
    music.next += sd;
  }
}
// 毎フレーム呼ぶ：ゲーム状態から流すべき曲を決めて切り替え、先読み予約する
function musicUpdate() {
  if (!AC || !musicBus || AC.state !== 'running') return;
  let want = null;
  if (musicArmed && !muted && state === 'play') want = boss ? (boss.state === 'dying' ? null : 'boss') : 'main';
  if (musicRestart) { musicRestart = false; if (want) musicStart(want); }
  if (want !== music.cur) {
    if (want) musicStart(want);
    else musicStop(muted ? 0.05 : 0.8);
  }
  const duck = state === 'play' && paused;
  if (duck !== music.duck) {
    music.duck = duck;
    const t = AC.currentTime;
    musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setTargetAtTime(MUSIC_VOL * (duck ? 0.35 : 1), t, 0.08);
  }
  if (music.cur) musicSchedule();
}

// ============================================================
//  地形（上下の起伏。ワールドX → 高さ）
// ============================================================
function band(x, a, b, f) { if (x <= a || x >= b) return 0; return Math.min(1, (x - a) / f, (b - x) / f); }
function floorH(wx) {
  if (wx < 1300 || wx > 8800) return 0;
  const hills = band(wx, 1300, 3750, 300) * (52 + 38 * Math.sin(wx * 0.0052) + 22 * Math.sin(wx * 0.0131 + 1.3));
  const flat  = band(wx, 3450, 5450, 220) * 70;
  const cave  = band(wx, 5200, 8800, 320) * (88 + 55 * Math.sin(wx * 0.0047) + 24 * Math.sin(wx * 0.017 + 2.1));
  return Math.max(hills, flat, cave, 0);
}
function ceilH(wx) {
  if (wx < 1300 || wx > 8800) return 0;
  const hills = band(wx, 1300, 3750, 300) * (18 + 14 * Math.sin(wx * 0.0071 + 0.4));
  const flat  = band(wx, 3450, 5450, 220) * 26;
  const cave  = band(wx, 5200, 8800, 320) * (88 + 55 * Math.sin(wx * 0.0047 + 2.6) + 24 * Math.sin(wx * 0.0133 + 0.7));
  return Math.max(hills, flat, cave, 0);
}
const groundY = sx => H - floorH(sx + G.scrollX);
const ceilY = sx => ceilH(sx + G.scrollX);
const gapMid = sx => (ceilY(sx) + groundY(sx)) / 2;

let state = 'title';      // title / play / gameover / clear

function saveHi() {

let G = null, P = null;
const enemies = [], ebul = [], pbul = [], caps = [], parts = [], rings = [], texts = [];
let groups = {}, groupSeq = 0;
let fort = null, boss = null, banner = null, shake = 0;

function makeDiff(L) {
  return {
    bs: Math.min(1 + 0.22 * (L - 1), 2),        // 敵弾速度
    fr: Math.min(1 + 0.4 * (L - 1), 2.6),       // 発射頻度
    hp: 1 + 0.35 * (L - 1),                     // 耐久
    revenge: L >= 2 ? Math.min(0.3 * (L - 1), 0.75) : 0   // 撃ち返し確率
  };
}
const D = () => G.d;

function makePlayer() {
  const p = { x: 110, y: H / 2, px: 110, py: H / 2, alive: true, inv: 120, respawnT: 0, speedLv: 0, missile: false, double: false,
              laser: false, options: 0, shield: 0, shieldFlash: 0, gauge: -1, shotCd: 0, missileCd: 0, trail: [], tilt: 0 };
  resetTrail(p);
  return p;
}
function resetTrail(p) { p.trail.length = 0; for (let i = 0; i < OPT_GAP * 2 + 2; i++) p.trail.push({ x: p.x, y: p.y }); }

function newGame() {
  G = { score: 0, lives: 3, loop: 1, nextExtend: 30000, scrollX: 0, scrollSpeed: BASE_SCROLL,
        events: [], evIdx: 0, t: 0, d: makeDiff(1), bonus: 0 };
  P = makePlayer();
  parts.length = 0; rings.length = 0; texts.length = 0;
  startLoop();
  state = 'play'; paused = false;
  // BGM はスタート操作以降に解禁し、リスタートのたびに頭から流す
  musicArmed = true; musicRestart = true;
  touch.accX = touch.accY = touch.adjY = 0;
}
function startLoop() {
  G.scrollX = 0; G.scrollSpeed = BASE_SCROLL; G.events = buildStage(); G.evIdx = 0; G.t = 0; G.d = makeDiff(G.loop);
  enemies.length = 0; ebul.length = 0; pbul.length = 0; caps.length = 0;
  groups = {}; fort = null; boss = null;
  P.alive = true; P.respawnT = 0;
  P.x = 110; P.y = H / 2; P.inv = Math.max(P.inv, 120);
  resetTrail(P);
  banner = { text: `第${G.loop}周 出撃`, sub: G.loop > 1 ? '敵の攻撃が激しくなった！' : '', t: 160 };
}
function nextLoop() { G.loop++; startLoop(); state = 'play'; musicRestart = true; touch.accX = touch.accY = touch.adjY = 0; }
function toGameOver() { state = 'gameover'; stateT = 0; saveHi(); }
function toClear() {
  // 最後の自機と相打ちでもボス撃破が先ならクリア優先（updatePlayer がゲームオーバーを保留している）
  G.bonus = Math.max(0, G.lives) * 3000 * G.loop;
  addScore(G.bonus);
  if (G.lives <= 0) G.lives = 1;   // 失った機体を補充し、次の周回は最後の1機から始める
  state = 'clear'; stateT = 0; saveHi();
  sfx('fanfare');
}
function addScore(n) {
  G.score += n;
  while (G.score >= G.nextExtend) {
    G.lives++; G.nextExtend += 50000;
    if (P.alive) addText(P.x, P.y - 24, '1UP！', '#7fffa0');
    sfx('extend');
  }
}
function addText(x, y, str, color) { texts.push({ x, y, str, color, t: 60, dead: false }); }

// ============================================================
//  ステージ構成（スクロール位置で出現）
// ============================================================
function buildStage() {
  const ev = [];
  const A = (at, type, o) => ev.push(Object.assign({ at, type }, o || {}));
  // 区間A：開けた宇宙空間
  A(80, 'wave', { y: 150, amp: 55 });
  A(300, 'wave', { y: 390, amp: 55 });
  A(520, 'straight', { ys: [110, 200, 290], red: 1 });
  A(700, 'wave', { y: 270, amp: 130 });
  A(860, 'aimer', { y: 150 });
  A(960, 'wave', { y: 400, amp: 40 });
  A(1100, 'straight', { ys: [330, 420] });
  A(1180, 'aimer', { y: 420 });
  // 区間B：起伏のある丘陵
  let i = 0;
  for (let at = 1300; at <= 2900; at += 200, i++) {
    switch (i % 4) {
      case 0: A(at, 'turret', { side: 'floor' }); A(at + 60, 'wave', { y: 180, amp: 60 }); break;
      case 1: A(at, 'turret', { side: 'floor' }); A(at + 40, 'straight', { ys: [150, 250], red: 1 }); break;
      case 2: A(at, 'turret', { side: 'ceil' }); A(at + 80, 'aimer', { y: 200 }); break;
      case 3: A(at, 'turret', { side: 'floor' }); A(at + 50, 'wave', { y: 260, amp: 90 }); break;
    }
  }
  A(3050, 'wave', { y: 150, amp: 50 });
  A(3150, 'straight', { ys: [100, 180, 260, 340] });
  A(3250, 'aimer', { y: 300 });
  // 中盤：地上要塞
  A(FORT_WX - W - 20, 'fortress');
  A(3420, 'wave', { y: 140, amp: 40 });
  // 区間D：洞窟（天井・地面の砲台）
  i = 0;
  for (let at = 4250; at <= 7700; at += 180, i++) {
    switch (i % 5) {
      case 0: A(at, 'turret', { side: 'floor' }); A(at + 20, 'turret', { side: 'ceil' }); break;
      case 1: A(at, 'wave', { y: 'mid', amp: 50 }); break;
      case 2: A(at, 'turret', { side: 'floor' }); A(at + 60, 'aimer', { y: 'mid' }); break;
      case 3: A(at, 'turret', { side: 'ceil' }); A(at + 40, 'straight', { ys: ['mid'], red: 1 }); break;
      case 4: A(at, 'wave', { y: 'mid', amp: 40 }); A(at + 90, 'turret', { side: 'floor' }); break;
    }
  }
  A(7900, 'wave', { y: 180, amp: 60 });
  A(8100, 'wave', { y: 360, amp: 60 });
  A(8300, 'straight', { ys: [150, 270, 390], red: 1 });
  // 最後：大型戦艦
  A(BOSS_AT, 'boss');
  ev.sort((a, b) => a.at - b.at);
  return ev;
}

const TERRAIN_PTS = [[16, 0], [-12, -7], [-12, 7], [0, -5], [0, 5]];

function updatePlayer() {

// ============================================================
//  自機の弾
// ============================================================
function updatePBullets() {
  for (const b of pbul) {
    if (b.dead) continue;
    if (b.kind === 'missile') {
      if (!b.crawl) {
        b.x += b.vx; b.y += b.vy;
        const gy = groundY(b.x);
        if (gy < H - 1 && b.y >= gy - 3) {
          if (gy < b.y - 12) { b.dead = true; spark(b.x, b.y, '#ffb040'); continue; }
          b.crawl = true; b.y = gy - 3;
        }
      } else {
        const nx = b.x + 3.6, gy = groundY(nx);
        if (gy >= H - 1) { b.crawl = false; b.vx = 2.2; b.vy = 3.6; b.x = nx; }
        else if (gy < b.y - 10) { b.dead = true; spark(b.x + 4, b.y, '#ffb040'); continue; }   // 壁に衝突
        else { b.x = nx; b.y = gy - 3; }
      }
      if (b.y < ceilY(b.x)) { b.dead = true; continue; }
    } else {
      b.x += b.vx; b.y += b.vy;
    }
    if (b.x > W + (b.len || 0) + 10 || b.x < -20 || b.y < -20 || b.y > H + 20) { b.dead = true; continue; }
    if (b.kind !== 'missile' && (b.y > groundY(b.x) || b.y < ceilY(b.x))) { b.dead = true; spark(b.x, b.y); continue; }
    hitEnemies(b);
    if (b.dead) continue;
    if (fort && fort.state === 'alive' && hitStruct(fort, b)) { b.dead = true; continue; }
    if (boss && (boss.state === 'fight' || boss.state === 'enter') && boss.x < W + 120 && hitStruct(boss, b)) { b.dead = true; continue; }
  }

}

  for (const e of enemies) {
    if (e.dead) continue;
    if (isL) {
      if (b.hit.has(e)) continue;
      if (circRect(e.cx, e.cy, e.r, b.x - b.len, b.y - 6, b.len, 12)) { b.hit.add(e); damageEnemy(e, b.dmg); }
    } else {
      const dx = e.cx - b.x, dy = e.cy - b.y, rr = e.r + br;

    }

}

    if (g && ++g.killed === g.n) { dropCap(e.cx, e.cy); addText(e.cx, e.cy - 18, '編隊全滅', '#ffcf6a'); }

  // 2周目以降は撃ち返し弾
  const d = D();
  if (d.revenge > 0 && P.alive && Math.random() < d.revenge && Math.hypot(P.x - e.cx, P.y - e.cy) > 110) aimShot(e.cx, e.cy, 3);

// ============================================================
//  敵
// ============================================================
function updateEnemies() {
  const d = D(), sp = G.scrollSpeed;
  for (const e of enemies) {
    if (e.dead) continue;
    e.t++;
    if (e.flash > 0) e.flash--;
    switch (e.type) {
      case 'wave':
        e.x += e.vx;
        e.y = (e.follow ? gapMid(e.x) : e.baseY) + e.amp * Math.sin(e.x * 0.012);
        e.cx = e.x; e.cy = e.y;
        break;
      case 'straight':
        e.x += e.vx;
        if (e.follow) e.y += (gapMid(e.x) - e.y) * 0.1;
        e.cx = e.x; e.cy = e.y;
        break;
      case 'aimer':
        if (e.phase === 'in') {

        const s = e.side === 'floor' ? -1 : 1;
        e.cx = e.x; e.cy = e.y + s * 8;
        const bx = e.cx, by = e.cy;
        const inSight = e.side === 'floor' ? P.y < by - 4 : P.y > by + 4;
        if (P.alive) {
          let a = Math.atan2(P.y - by, P.x - bx);
          if (e.side === 'floor') { if (a > 0) a = a < Math.PI / 2 ? -0.05 : -Math.PI + 0.05; }
          else { if (a < 0) a = a > -Math.PI / 2 ? 0.05 : Math.PI - 0.05; }

  else { x0 = b.x - 5; y0 = b.y - 4; w = 10; h = 8; }
  const ox = s.x, oy = s.oy;
  for (const p of s.plates) {
    if (p.hp <= 0) continue;
    if (rectRect(x0, y0, w, h, ox + p.dx, oy + s.plateY, s.plateW, s.plateH)) {
      p.hp -= b.dmg; p.flash = 3;
      if (p.hp <= 0) { explode(ox + p.dx + 4, oy + s.plateY + s.plateH / 2, 1); addScore(200); }
      else sfx('tink');
      return true;
    }
  }
  const c = s.core;
  if (c.hp > 0 && circRect(ox + c.dx, oy + c.dy, c.r, x0, y0, w, h)) {
    c.hp -= b.dmg; c.flash = 3; sfx('hit');
    if (c.hp <= 0) s.onDestroy();
    return true;
  }
  for (const r of s.body) {
    if (rectRect(x0, y0, w, h, ox + r[0], oy + r[1], r[2], r[3])) { spark(b.x, b.y); sfx('tink'); return true; }
  }
  return false;
}
function structHitsPlayer(s, x = P.x, y = P.y) {

  for (const p of s.plates) if (p.hp > 0 && rectRect(px, py, pw, ph, s.x + p.dx, s.oy + s.plateY, s.plateW, s.plateH)) return true;
  const c = s.core;
  return c.hp > 0 && circRect(s.x + c.dx, s.oy + c.dy, c.r, px, py, pw, ph);
}

//  カプセル・敵弾・パーティクル
// ============================================================
function updateCaps() {
  for (const c of caps) {
    c.t++;
    if (c.death && !P.alive) {
      // 死亡時カプセルは復帰まで流さずその場で待つ（スクロールする地形に埋まらないよう隙間内に保つ）
      c.y = clamp(c.y + Math.sin(c.t * 0.08) * 0.4, ceilY(c.x) + 16, groundY(c.x) - 16);
      continue;
    }
    c.x -= 0.9 + G.scrollSpeed * 0.4;
    c.y += Math.sin(c.t * 0.08) * 0.4;
    if (c.x < -20) { c.dead = true; continue; }
    if (P.alive) {
      const dx = c.x - P.x, dy = c.y - P.y;
      if (dx * dx + dy * dy < 22 * 22) {
        c.dead = true;
        P.gauge = (P.gauge + 1) % 6;
        addScore(100);
        sfx('cap');
      }
    }
  }
  compact(caps);
}
// 1更新の間の自機（基準点を ox だけ前にずらす）と弾の最接近距離の2乗。
// 自機は P.px,py → P.x,y、弾は (x-vx,y-vy) → (x,y) を同時に直線移動したとみなす（速いドラッグのすり抜け防止）。
// 最接近時の自機基準点からの相対Xを sweptRX に残す。
let sweptRX = 0;
function sweptD2(b, ox) {
  const sx = (b.x - b.vx) - (P.px + ox), sy = (b.y - b.vy) - P.py;
  const mx = (b.x - (P.x + ox)) - sx, my = (b.y - P.y) - sy, L = mx * mx + my * my;
  const t = L > 0 ? clamp(-(sx * mx + sy * my) / L, 0, 1) : 1;
  const cx = sx + mx * t, cy = sy + my * t;
  sweptRX = cx;
  return cx * cx + cy * cy;
}
function updateEBullets() {
  for (const b of ebul) {
    b.x += b.vx; b.y += b.vy;
    if (b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10) { b.dead = true; continue; }
    if (b.y > groundY(b.x) || b.y < ceilY(b.x)) { b.dead = true; continue; }
    if (!P.alive) continue;
    if (P.shield > 0) {                      // 前面シールド（中心は自機の20px前。自機より前方の弾だけ）
      const rr = 22 + b.r, d2 = sweptD2(b, 20);
      if (d2 < rr * rr && sweptRX > -16) {
        b.dead = true; P.shield--; P.shieldFlash = 8; spark(b.x, b.y, '#7ff'); sfx('shield');
        continue;
      }
    }
    if (P.inv <= 0) {
      const rr = b.r + 3;
      if (sweptD2(b, 0) < rr * rr) { b.dead = true; killPlayer(); }
    }
  }
  compact(ebul);
}
function updateParticles() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; if (--p.life <= 0) p.dead = true; }
  compact(parts);
  for (const r of rings) { r.r += r.vr; if (--r.life <= 0) r.dead = true; }
  compact(rings);
  for (const t of texts) { t.y -= 0.5; if (--t.t <= 0) t.dead = true; }
  compact(texts);
}

// ============================================================
//  更新
// ============================================================
function stepGame() {
  G.t++;
  const lock = fort && (fort.state === 'dying' || (fort.state === 'alive' && fort.x <= 600 && !fort.released));
  G.scrollSpeed = lock ? 0 : BASE_SCROLL;
  G.scrollX += G.scrollSpeed;
  while (G.evIdx < G.events.length && G.scrollX >= G.events[G.evIdx].at) spawnEvent(G.events[G.evIdx++]);
  updatePlayer();
  if (state !== 'play') return;
  updateEnemies();
  if (fort) updateFort();
  if (boss) updateBoss();
  if (state !== 'play') return;
  updatePBullets();
  updateEBullets();
  updateCaps();
  updateParticles();
  if (banner && --banner.t <= 0) banner = null;
}
function update() {
  frameCount++;
  if (gpNotice && --gpNotice.t <= 0) gpNotice = null;
  if (!(state === 'play' && paused)) { updateStars(); nebX += 0.12; }
  if (shake > 0) { shake *= 0.88; if (shake < 0.3) shake = 0; }
  if (pressed.KeyM) { muted = !muted; applyMute(); }
  const start = pressed.KeyZ || pressed.Space || pressed.Enter || pressed.NumpadEnter;
  const gpOk = pressed.GpShot || pressed.GpStart;   // コントローラーの決定（A / X / START）
  const tap = pressed.TouchTap;                     // タッチ（プレイ中以外の画面タップ）
  switch (state) {
    case 'title':
      titleT++;
      if (start || gpOk || tap) newGame();
      break;
    case 'play':
      if (PAUSE_TOGGLES.some(k => pressed[k])) {
        paused = !paused;
        if (paused) discardTouchMove();   // 手動ポーズでも未消費のドラッグ量・指よけ補正は捨てる
        sfx('pause');
      }
      if (paused) { if (pressed.KeyR) newGame(); }
      else stepGame();
      break;
    case 'gameover':
      stateT++; updateParticles();
      // コントローラー／タッチは死亡直後の連打で画面を飛ばさないよう少し待ってから受け付ける
      if (pressed.KeyR || (stateT > 45 && (gpOk || tap))) newGame();
      break;
    case 'clear':
      stateT++; updateParticles();
      if ((stateT > 90 && (start || gpOk || tap)) || stateT > 600) nextLoop();
      break;
  }
  for (const k in pressed) delete pressed[k];
}

function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function poly(pts, color, flipY) {
  ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const x = pts[i][0], y = flipY ? -pts[i][1] : pts[i][1];
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}
function drawBackground() {
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  const off = nebX % W;
  ctx.drawImage(neb, -off, 0, W, H);

    ctx.globalAlpha = L.a; ctx.fillStyle = L.c;

}
const TX = new Float32Array(160), TF = new Float32Array(160), TC = new Float32Array(160);
function drawTerrain() {
  const off = G.scrollX % 8;

  for (let x = -off; x <= W + 8; x += 8) {   // 頂点をワールド座標の8px格子に固定（揺らぎ防止）
    const wx = x + G.scrollX, f = floorH(wx), c = ceilH(wx);
    TX[n] = x; TF[n] = H - f; TC[n] = c;
    if (f > maxF) maxF = f; if (c > maxC) maxC = c;
    n++;
  }
  if (maxF > 0) {
    ctx.beginPath(); ctx.moveTo(TX[0], H);
    for (let i = 0; i < n; i++) ctx.lineTo(TX[i], TF[i]);
    ctx.lineTo(TX[n - 1], H); ctx.closePath();
    ctx.fillStyle = floorGrad; ctx.fill();
    ctx.lineWidth = 2;
    ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(TX[i], TF[i]) : ctx.moveTo(TX[i], TF[i]);
    ctx.strokeStyle = '#72e6c0'; ctx.stroke();
    ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(TX[i], TF[i] + 12) : ctx.moveTo(TX[i], TF[i] + 12);
    ctx.strokeStyle = 'rgba(70,170,150,0.35)'; ctx.stroke();
  }
  if (maxC > 0) {
    ctx.beginPath(); ctx.moveTo(TX[0], 0);
    for (let i = 0; i < n; i++) ctx.lineTo(TX[i], TC[i]);
    ctx.lineTo(TX[n - 1], 0); ctx.closePath();
    ctx.fillStyle = ceilGrad; ctx.fill();
    ctx.lineWidth = 2;
    ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(TX[i], TC[i]) : ctx.moveTo(TX[i], TC[i]);
    ctx.strokeStyle = '#72e6c0'; ctx.stroke();
    ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(TX[i], TC[i] - 12) : ctx.moveTo(TX[i], TC[i] - 12);
    ctx.strokeStyle = 'rgba(70,170,150,0.35)'; ctx.stroke();
  }
}
function drawShip(x, y, tilt) {

function drawEnemy(e) {

function drawCaps() {

function drawPBullets() {

function drawEBullets() {

function drawParticles() {

}
function dim(a) { ctx.fillStyle = `rgba(0,0,8,${a})`; ctx.fillRect(0, 0, W, H); }
